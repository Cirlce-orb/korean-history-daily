<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily History Fact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f0e7;color:#332d28;font-family:'Noto Serif KR',serif}
header{max-width:1100px;margin:auto;padding:25px;border-bottom:1px solid #d8cec0;display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:25px;font-weight:700}
.header-info{text-align:right}
.date{color:#776c61;font-size:14px}
.weather{color:#917b6f;font-size:13px;margin-top:5px}
main{max-width:1100px;margin:auto;padding:48px 25px}
.intro{text-align:center;margin-bottom:35px}
.intro h1{font-size:40px;font-weight:600;margin-bottom:12px}
.intro p{color:#796f66;line-height:1.8}
.card{background:#fffdf9;border:1px solid #ded5c9;display:grid;grid-template-columns:1fr 1.15fr;min-height:400px;box-shadow:0 8px 30px rgba(70,55,40,.06);cursor:pointer;transition:.2s}
.card:hover{box-shadow:0 12px 32px rgba(70,55,40,.12)}
.image{background:#e7dfd3;min-height:400px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:100px;color:#817467;position:relative}
.image img{width:100%;height:100%;min-height:400px;object-fit:cover;display:block}
.image .image-credit{position:absolute;bottom:0;left:0;right:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:white;font:11px sans-serif;text-align:right;pointer-events:none}
.image .image-credit a{color:white}
.info{padding:45px;display:flex;flex-direction:column;justify-content:center}
.label{color:#917b6f;font-size:13px;margin-bottom:15px}
.name{font-size:38px;margin-bottom:10px}
.period{color:#81766c;margin-bottom:24px}
.description{line-height:2;font-size:16px;margin-bottom:25px}
.detail-button{align-self:flex-start;border:1px solid #917b6f;background:transparent;color:#66564d;padding:12px 20px;font-family:inherit;cursor:pointer}
.detail-button:hover{background:#917b6f;color:white}
.search-section{margin-top:55px}
.search-title{font-size:25px;margin-bottom:10px}
.search-subtitle{color:#796f66;font-size:14px;margin-bottom:20px}
.controls{display:flex;gap:10px;margin-bottom:25px}
input,select{background:#fffdf9;border:1px solid #d8cec0;padding:14px 15px;font-family:inherit;color:#443a33;font-size:15px;min-width:0}
input{flex:1} select{width:150px}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.result-card{background:#fffdf9;border:1px solid #ded5c9;padding:0 0 22px;cursor:pointer;transition:.2s;min-width:0;overflow:hidden}
.result-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(60,45,30,.08)}
.result-image{height:165px;background:#e7dfd3;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#817467;font-size:54px;margin-bottom:18px}
.result-image img{width:100%;height:100%;object-fit:cover;display:block}
.result-card .result-type,.result-card h3,.result-card .result-period,.result-card .result-description{margin-left:22px;margin-right:22px}
.result-type{color:#917b6f;font-size:12px;margin-bottom:10px}
.result-card h3{font-size:21px;margin-bottom:8px}
.result-period{color:#82776c;font-size:13px;margin-bottom:12px}
.result-description{font-size:14px;line-height:1.8;color:#514941}
.empty{grid-column:1/-1;text-align:center;padding:35px 15px;color:#82776c;line-height:1.8}
footer{border-top:1px solid #d8cec0;text-align:center;padding:30px;color:#85796e;font-size:13px;margin-top:40px}
@media(max-width:700px){
 header{padding:20px;align-items:flex-start}.logo{font-size:19px}.date{font-size:12px}.weather{font-size:11px}
 main{padding:35px 18px}.intro h1{font-size:31px}.card{grid-template-columns:1fr}
 .image{min-height:230px;height:230px;font-size:75px}.image img{min-height:230px}
 .info{padding:28px}.name{font-size:31px}.controls{flex-direction:column}select{width:100%}.results{grid-template-columns:1fr}.result-image{height:200px}
}

/* 궁궐 정문 인트로 */
body.intro-locked{overflow:hidden}
#palaceIntro{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 28%,#5b3523 0,#211711 48%,#100d0b 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity 1.15s ease,visibility 1.15s ease;color:#f8e9c8}
#palaceIntro.dismissed{opacity:0;visibility:hidden;pointer-events:none}
.palace-scene{position:relative;width:min(100vw,1100px);height:min(100vh,850px);min-height:520px;display:flex;align-items:center;justify-content:center;perspective:1400px}
.palace-roof{position:absolute;top:4%;left:5%;right:5%;height:21%;background:repeating-linear-gradient(90deg,transparent 0 20px,rgba(226,173,66,.28) 21px 24px),linear-gradient(180deg,#183f35,#0b2925 48%,#a85b2a 50%,#233d30 58%,#13231e);clip-path:polygon(9% 0,91% 0,100% 52%,83% 42%,75% 67%,25% 67%,17% 42%,0 52%);border-top:7px solid #c69a45;filter:drop-shadow(0 12px 14px #000)}
.palace-roof:after{content:'❖　✦　❖　✦　❖　✦　❖';position:absolute;top:28%;left:0;right:0;text-align:center;color:#e4b958;font-size:clamp(15px,2.4vw,27px);letter-spacing:.3em;text-shadow:0 2px #6c251e}
.gate-frame{position:absolute;left:13%;right:13%;top:20%;bottom:6%;border:13px solid #6b321f;box-shadow:0 0 0 4px #c39348,0 0 45px #000;background:#160f0c;overflow:hidden}
.gate-top{position:absolute;z-index:4;left:0;right:0;top:0;height:11%;background:repeating-linear-gradient(90deg,#153b30 0 24px,#d2a14c 25px 28px,#9b3325 29px 44px,#e0bd66 45px 48px);border-bottom:5px solid #d5a64e}
.gate-doors{position:absolute;inset:0;display:flex;transform-style:preserve-3d;perspective:1000px}
.gate-door{position:relative;width:50%;height:100%;background:repeating-linear-gradient(90deg,rgba(30,8,5,.3) 0 2px,transparent 2px 35px),linear-gradient(90deg,#4d1e16,#8e3526 16%,#6d251c 50%,#913a29 83%,#48180f);border:4px solid #b47b38;box-shadow:inset 0 0 25px #220b07;transition:transform 2.1s cubic-bezier(.2,.72,.2,1);transform-style:preserve-3d}
.gate-door:before{content:'';position:absolute;inset:14% 12%;border:3px solid #d1a354;box-shadow:inset 0 0 0 3px #512116,inset 0 0 0 7px #a96932;opacity:.9}
.gate-door:after{content:'✿';position:absolute;top:48%;color:#d6b16b;font-size:clamp(30px,5vw,54px);text-shadow:0 2px #32140d}
.gate-door.left:after{right:8%;transform:translateX(50%)}.gate-door.right:after{left:8%;transform:translateX(-50%)}
.gate-door.left{transform-origin:left center}.gate-door.right{transform-origin:right center}
#palaceIntro.opening .gate-door.left{transform:rotateY(-108deg)}#palaceIntro.opening .gate-door.right{transform:rotateY(108deg)}
.gate-knocker{position:absolute;z-index:5;left:50%;top:52%;transform:translate(-50%,-50%);width:clamp(76px,10vw,112px);aspect-ratio:1;border-radius:50%;border:5px double #e2bf72;background:radial-gradient(circle,#59331d 0 24%,#c49a50 25% 31%,#51301d 32% 61%,#d0a55b 62% 67%,#4a2618 68%);box-shadow:0 4px 15px #160804;display:grid;place-items:center;font-size:clamp(25px,4vw,40px);cursor:pointer;color:#e9cb83;touch-action:manipulation}
.gate-knocker:focus-visible{outline:3px solid #fff1c3;outline-offset:5px}
.ripple{position:absolute;z-index:6;left:50%;top:52%;width:24px;height:24px;border:2px solid #f0d28c;border-radius:50%;transform:translate(-50%,-50%) scale(.3);pointer-events:none;animation:ripple .8s ease-out forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(6);opacity:0}}
#introCopy{position:absolute;z-index:8;bottom:8%;left:10%;right:10%;text-align:center;text-shadow:0 2px 12px #000}
#introCopy .eyebrow{font-size:12px;letter-spacing:.35em;color:#d8b875;margin-bottom:12px}
#introCopy h2{font-size:clamp(27px,4.6vw,48px);font-weight:500;letter-spacing:.12em;margin-bottom:12px}
#introCopy p{font-size:14px;color:#e0cfad;line-height:1.8}
#knockCount{display:inline-flex;gap:10px;margin-top:18px}
#knockCount span{width:7px;height:7px;border:1px solid #d7b66f;border-radius:50%;opacity:.55;transition:.2s}
#knockCount span.hit{background:#f1d48e;opacity:1;box-shadow:0 0 10px #f1d48e}
#royalReveal{position:absolute;z-index:7;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;opacity:0;transform:translateY(25px) scale(.97);pointer-events:none;transition:opacity 1s ease,transform 1s ease;background:radial-gradient(ellipse at 50% 48%,rgba(207,137,50,.25),transparent 47%)}
#palaceIntro.revealing #royalReveal{opacity:1;transform:translateY(0) scale(1)}
#royalReveal .royal-crown{font-size:clamp(42px,8vw,80px);filter:drop-shadow(0 6px 10px #000);margin-bottom:10px}
#royalReveal .royal-name{font-size:clamp(30px,5vw,54px);text-shadow:0 3px 20px #000;margin-bottom:8px}
#royalReveal .royal-meta{font-size:14px;color:#f0d6a1;letter-spacing:.1em}
#royalReveal .royal-desc{max-width:560px;padding:0 24px;margin-top:18px;font-size:15px;line-height:1.9;color:#fff0d1}
@media(max-width:600px){.palace-scene{min-height:480px}.palace-roof{top:8%;left:-2%;right:-2%;height:18%}.gate-frame{left:5%;right:5%;top:23%;bottom:22%;border-width:8px}.gate-top{height:9%}#introCopy{bottom:5%;left:5%;right:5%}#introCopy p{font-size:12px}}
@media(prefers-reduced-motion:reduce){.gate-door,#palaceIntro,#royalReveal{transition-duration:.01ms}.ripple{animation-duration:.01ms}}

</style>
</head>
<body class="intro-locked">

<div id="palaceIntro" role="dialog" aria-label="궁궐 문 열기">
  <div class="palace-scene">
    <div class="palace-roof" aria-hidden="true"></div>
    <div class="gate-frame" aria-hidden="true">
      <div class="gate-top"></div>
      <div class="gate-doors"><div class="gate-door left"></div><div class="gate-door right"></div></div>
      <button class="gate-knocker" id="gateKnocker" type="button" aria-label="궁궐 문 노크하기">◉</button>
    </div>
    <div id="royalReveal" aria-live="polite">
      <div class="royal-crown">♛</div><div class="royal-name" id="revealName">오늘의 인물</div>
      <div class="royal-meta" id="revealMeta"></div><p class="royal-desc" id="revealDesc"></p>
    </div>
    <div id="introCopy">
      <div class="eyebrow">DAILY HISTORY FACT</div><h2>역사관의 문을 두드리다</h2>
      <p id="knockHint">문고리를 세 번 눌러 오늘의 인물을 만나보세요.</p>
      <div id="knockCount" aria-label="노크 횟수"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<header>
  <div class="logo">Daily History Fact</div>
  <div class="header-info">
    <div class="date" id="today"></div>
    <div class="weather" id="weather">날씨를 불러오는 중...</div>
  </div>
</header>
<main>
  <section class="intro">
    <h1>하루 한 번, 역사를 발견하다.</h1>
    <p>오늘의 역사 인물 또는 유물을 만나보세요.</p>
  </section>
  <section class="card" id="todayCard" role="link" tabindex="0" aria-label="오늘의 콘텐츠 자세히 보기">
    <div class="image" id="todayImage" aria-label="역사 이미지">歷</div>
    <div class="info">
      <div class="label" id="todayLabel">TODAY'S HISTORY</div>
      <h2 class="name" id="todayName">불러오는 중...</h2>
      <div class="period" id="todayPeriod"></div>
      <p class="description" id="todayDescription"></p>
      <button class="detail-button" id="detailButton" type="button">자세히 알아보기 →</button>
    </div>
  </section>
  <section class="search-section">
    <h2 class="search-title">역사를 검색하다</h2>
    <p class="search-subtitle">인물이나 유물의 이름을 검색하세요. 결과를 누르면 상세 페이지로 이동합니다.</p>
    <div class="controls">
      <input id="search" type="search" placeholder="예: 세종대왕, 이순신, 금동대향로" autocomplete="off" aria-label="역사 인물 또는 유물 검색">
      <select id="category" aria-label="검색 범위">
        <option value="all">전체</option><option value="person">인물</option><option value="artifact">유물</option>
      </select>
    </div>
    <section class="results" id="results" aria-live="polite"></section>
  </section>
</main>
<footer>Daily History Fact · Korean History</footer>
<script>
let people = [];
let artifacts = [];
let todayItem = null;
const imageCache = new Map();
const $ = id => document.getElementById(id);
const today = new Date();
const weekdays = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
$("today").textContent = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 ${weekdays[today.getDay()]}`;

function getAllItems(){
  return [
    ...people.map(person => ({...person,type:"person"})),
    ...artifacts.map(artifact => ({...artifact,type:"artifact"}))
  ];
}
function getDailyItem(){
  const items = getAllItems();
  if(!items.length) return null;
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,0))/86400000);
  return items[dayOfYear % items.length];
}
function openDetail(item){
  if(!item) return;
  location.href = "detail.html?type=" + (item.type === "artifact" ? "artifact" : "person") + "&id=" + encodeURIComponent(item.name);
}

/* 이미지가 없으면 이름 첫 글자(또는 유물 표식)를 유지합니다. */
function setImageFallback(container, item){
  container.replaceChildren();
  container.textContent = item && item.name ? item.name.charAt(0) : "歷";
  container.setAttribute("aria-label", (item?.name || "역사") + " 이미지 없음");
}

/* 한국어 위키백과에서 이름과 일치하는 문서의 대표 이미지를 조회합니다.
   동명이인이나 다른 제목의 문서는 자동으로 억지 매칭하지 않고, 이미지가 없으면 첫 글자를 표시합니다. */
async function findWikipediaThumbnail(title){
  if(imageCache.has(title)) return imageCache.get(title);
  const api = "https://ko.wikipedia.org/w/api.php";
  const params = new URLSearchParams({
    action:"query",format:"json",origin:"*",prop:"pageimages",
    piprop:"thumbnail",pithumbsize:"900",redirects:"1",titles:title
  });
  try{
    const response = await fetch(`${api}?${params}`);
    if(!response.ok) return null;
    const data = await response.json();
    const pages = Object.values(data?.query?.pages || {});
    const exact = pages.find(page => page && page.thumbnail && !page.missing);
    if(exact){
      const result = {url:exact.thumbnail.source,title:exact.title};
      imageCache.set(title,result);
      return result;
    }
  }catch(error){ console.warn("위키백과 이미지 조회 실패:", error); }
  imageCache.set(title,null);
  return null;
}
async function loadItemImage(container, item){
  setImageFallback(container,item);
  if(!item?.name) return;
  const result = await findWikipediaThumbnail(item.name);
  if(!result) return;
  const img = document.createElement("img");
  img.src = result.url;
  img.alt = item.name + " 이미지";
  img.loading = "eager";
  img.referrerPolicy = "no-referrer";
  img.onerror = () => setImageFallback(container,item);
  const credit = document.createElement("div");
  credit.className = "image-credit";
  credit.textContent = "이미지 출처: 한국어 위키백과 · " + result.title;
  container.replaceChildren(img,credit);
  container.setAttribute("aria-label",item.name + " 이미지");
}

async function loadResultImage(container,item){
  if(!item?.name) return;
  const result=await findWikipediaThumbnail(item.name);
  if(!result || !container.isConnected) return;
  const img=document.createElement("img");
  img.src=result.url;
  img.alt=item.name+" 이미지";
  img.loading="lazy";
  img.referrerPolicy="no-referrer";
  img.onerror=()=>{container.replaceChildren();container.textContent=item.name.charAt(0);};
  container.replaceChildren(img);
  container.setAttribute("aria-label",item.name+" 이미지");
}

function displayToday(){
  todayItem = getDailyItem();
  if(!todayItem) return;
  const isArtifact = todayItem.type === "artifact";
  $("todayLabel").textContent = isArtifact ? "TODAY'S HISTORICAL ARTIFACT" : "TODAY'S HISTORICAL FIGURE";
  $("todayName").textContent = todayItem.name;
  $("todayPeriod").textContent = [todayItem.era,todayItem.birth_death || todayItem.period].filter(Boolean).join(" · ");
  $("todayDescription").textContent = todayItem.description || "상세 페이지에서 더 알아보세요.";
  loadItemImage($("todayImage"),todayItem);
  $("todayCard").onclick = () => openDetail(todayItem);
  $("todayCard").onkeydown = event => {
    if(event.key === "Enter" || event.key === " "){event.preventDefault();openDetail(todayItem);}
  };
  $("detailButton").onclick = event => {event.stopPropagation();openDetail(todayItem);};
}
function renderResults(){
  const keyword = $("search").value.trim().toLocaleLowerCase();
  const category = $("category").value;
  const container = $("results");
  if(!keyword){container.replaceChildren();return;}
  const items = getAllItems().filter(item =>
    (item.name || "").toLocaleLowerCase().includes(keyword) &&
    (category === "all" || item.type === category)
  ).slice(0,60);
  container.replaceChildren();
  if(!items.length){
    const empty = document.createElement("p");empty.className="empty";
    empty.textContent="검색 결과가 없습니다. 다른 이름으로 검색해보세요.";
    container.appendChild(empty);return;
  }
  items.forEach(item => {
    const card=document.createElement("article");card.className="result-card";card.tabIndex=0;card.setAttribute("role","link");
    const imageBox=document.createElement("div");imageBox.className="result-image";
    imageBox.textContent=item.name ? item.name.charAt(0) : "歷";
    imageBox.setAttribute("aria-label",(item.name||"역사")+" 이미지");
    const type=document.createElement("div");type.className="result-type";
    type.textContent=item.type==="artifact"?"역사 유물 · ARTIFACT":"역사 인물 · FIGURE";
    const name=document.createElement("h3");name.textContent=item.name;
    const period=document.createElement("div");period.className="result-period";
    period.textContent=[item.era,item.birth_death||item.period].filter(Boolean).join(" · ");
    const description=document.createElement("p");description.className="result-description";
    description.textContent=item.description||"자세한 설명을 확인하세요.";
    card.append(imageBox,type,name,period,description);
    loadResultImage(imageBox,item);
    card.onclick=()=>openDetail(item);
    card.onkeydown=event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openDetail(item);}};
    container.appendChild(card);
  });
  if(items.length===60){
    const note=document.createElement("p");note.className="empty";
    note.textContent="검색 결과가 많아 최대 60개까지 표시했습니다. 이름을 더 구체적으로 검색해보세요.";
    container.appendChild(note);
  }
}
$("search").addEventListener("input",renderResults);
$("category").addEventListener("change",renderResults);

async function getWeather(){
  try{
    const response=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul");
    if(!response.ok) throw new Error("날씨 요청 실패");
    const data=await response.json();
    const temperature=Math.round(data.current.temperature_2m);
    const max=Math.round(data.daily.temperature_2m_max[0]);
    const min=Math.round(data.daily.temperature_2m_min[0]);
    const code=data.current.weather_code;
    let weatherText="맑음";
    if(code===1) weatherText="대체로 맑음";
    else if(code===2) weatherText="구름 조금";
    else if(code===3) weatherText="흐림";
    else if(code>=45&&code<=48) weatherText="안개";
    else if(code>=51&&code<=67) weatherText="비";
    else if(code>=71&&code<=77) weatherText="눈";
    else if(code>=80&&code<=82) weatherText="소나기";
    else if(code>=95) weatherText="뇌우";
    $("weather").textContent=`서울 · ${weatherText} · 현재 ${temperature}°C · 최고 ${max}°C / 최저 ${min}°C`;
  }catch(error){
    console.error("날씨 불러오기 실패:",error);
    $("weather").textContent="서울 · 날씨 정보를 불러올 수 없습니다.";
  }
}
async function loadData(){
  try{
    const [peopleResponse,artifactsResponse]=await Promise.all([
      fetch("./people.json"),fetch("./artifacts.json")
    ]);
    if(!peopleResponse.ok) throw new Error("people.json을 불러오지 못했습니다.");
    const peopleData=await peopleResponse.json();
    people=Array.isArray(peopleData)?peopleData.filter(item=>item&&item.name&&item.era):[];
    if(artifactsResponse.ok){
      const data=await artifactsResponse.json();
      artifacts=Array.isArray(data)?data.filter(item=>item&&item.name):[];
    }else{
      artifacts=[];
      console.warn("artifacts.json이 없습니다. 유물 없이 인물만 표시합니다.");
    }
    displayToday();
  }catch(error){
    console.error(error);
    $("todayName").textContent="데이터를 불러오지 못했습니다.";
    $("todayDescription").textContent="people.json 파일이 index.html과 같은 폴더에 있는지 확인해주세요.";
  }
}

let knockCount = 0;
let introFinished = false;
function knockGate(event){
  if(introFinished || knockCount >= 3) return;
  knockCount++;
  const frame = document.querySelector('.gate-frame');
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  frame.appendChild(ripple);
  window.setTimeout(()=>ripple.remove(),850);
  document.querySelectorAll('#knockCount span')[knockCount-1]?.classList.add('hit');
  const knocker = $('gateKnocker');
  knocker.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(.88)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:220,easing:'ease-out'});
  if(knockCount < 3){
    $('knockHint').textContent = knockCount === 1 ? '똑… 한 번 더 두드려보세요.' : '똑, 똑… 마지막으로 한 번 더.';
    return;
  }
  introFinished = true;
  $('knockHint').textContent = '문이 열리고 있습니다…';
  $('palaceIntro').classList.add('opening');
  knocker.disabled = true;
  window.setTimeout(()=>{
    const item = todayItem;
    $('revealName').textContent = item?.name || '오늘의 인물';
    $('revealMeta').textContent = [item?.era,item?.birth_death||item?.period].filter(Boolean).join(' · ');
    $('revealDesc').textContent = item?.description || '오늘의 한국사 인물을 만나보세요.';
    $('palaceIntro').classList.add('revealing');
    $('introCopy').style.opacity = '0';
  },1500);
  window.setTimeout(()=>{
    $('palaceIntro').classList.add('dismissed');
    document.body.classList.remove('intro-locked');
  },5100);
}
$('gateKnocker').addEventListener('click',knockGate);

loadData();
getWeather();
</script>
</body>
</html>
