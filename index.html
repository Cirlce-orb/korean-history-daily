
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사관의 문을 두드리다</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #f5f0e7;
  --ink: #332d28;
  --gold: #b69a60;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif KR", serif;
}

header {
  text-align: center;
  padding: 28px 12px 20px;
}
.eyebrow {
  color: #9b8469;
  font-size: 12px;
  letter-spacing: 5px;
}
h1 {
  margin: 13px 0;
  font-size: clamp(26px, 4vw, 43px);
  font-weight: 500;
}
.subtitle { color: #8d7d6d; font-size: 15px; }

/* 상단 단청 */
.roof {
  width: 100%;
  height: 76px;
  background:
    repeating-linear-gradient(90deg, transparent 0 19px, #d5b66e 19px 24px, transparent 24px 42px),
    repeating-linear-gradient(45deg, transparent 0 20px, #d5b66e 20px 25px, #a74b36 25px 30px, transparent 30px 43px),
    repeating-linear-gradient(-45deg, #183d32 0 24px, #d5b66e 24px 29px, #183d32 29px 46px);
  border-bottom: 12px solid #70402c;
  box-shadow: 0 5px 0 #d8cdbd;
}

/* 문 */
.gate-area {
  width: 100%;
  padding: 0 12px;
  margin: 22px auto 0;
}
.gate-frame {
  position: relative;
  width: 100%;
  height: clamp(430px, 67vw, 730px);
  min-height: 400px;
  max-height: 78vh;
  overflow: hidden;
  perspective: 1500px;
  background: #173b30;
  border: 8px solid #70402c;
  outline: 3px solid #c6a461;
  box-shadow: inset 0 0 0 4px #e5ca83, 0 12px 30px #33251c20;
}

.inside {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at center, #e6d3a5, #78866a 48%, #18372d);
  text-align: center;
  color: #fff0c9;
}
.inside h2 {
  font-weight: 400;
  font-size: clamp(35px, 6vw, 65px);
  letter-spacing: 10px;
  margin: 0;
}
.inside p { font-size: 14px; }

.door {
  position: absolute;
  z-index: 2;
  top: 0;
  width: 50%;
  height: 100%;
  background-image: url("./palace-door.png");
  background-repeat: no-repeat;
  background-size: 200% 100%;
  transition: transform 1.6s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}
.door.left {
  left: 0;
  background-position: left center;
  transform-origin: left center;
  border-right: 2px solid #d8b76b;
}
.door.right {
  right: 0;
  background-position: right center;
  transform-origin: right center;
  border-left: 2px solid #d8b76b;
}
.gate-frame.open .door.left { transform: rotateY(-110deg); }
.gate-frame.open .door.right { transform: rotateY(110deg); }

/* 클릭하는 문고리 */
.handle {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 43%;
  transform: translate(-50%, -50%);
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 4px solid #f2d68a;
  background: radial-gradient(circle at 35% 30%, #fff1b4, #c69a43 65%, #795229);
  box-shadow: 0 0 0 3px #795229, inset 0 0 0 5px #f8e4a2;
  cursor: pointer;
  transition: opacity .3s;
}
.handle::after {
  content: "";
  position: absolute;
  inset: 15px;
  border: 3px solid #795229;
  border-radius: 50%;
}
.gate-frame.open .handle {
  opacity: 0;
  pointer-events: none;
}

/* 문 중앙에 나타나는 인물과 금색 테두리 */
.person-reveal {
  position: absolute;
  z-index: 4;
  inset: 4% 7%;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(.75);
  pointer-events: none;
  transition: opacity 1s ease, transform 1s ease;
}
.person-reveal.show {
  opacity: 1;
  transform: scale(1);
}

/* 테두리 이미지 */
.history-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 0;
  pointer-events: none;
}

/* 테두리 내부의 글 */
.person-content {
  position: relative;
  z-index: 1;
  width: 76%;
  max-height: 75%;
  overflow: auto;
  text-align: center;
  padding: 20px 12px;
  color: #403321;
  background: rgba(255, 253, 246, .90);
  border-radius: 3px;
}
.person-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #947744;
}
#personName {
  margin: 10px 0;
  font-size: clamp(22px, 4vw, 38px);
  font-weight: 500;
}
#personPeriod {
  font-size: 12px;
  color: #7b6b56;
}
#personDescription {
  margin: 14px auto 0;
  max-width: 540px;
  font-size: clamp(12px, 1.6vw, 15px);
  line-height: 1.9;
  white-space: pre-line;
}

.instruction {
  margin: 24px 10px;
  text-align: center;
  font-size: 15px;
  line-height: 1.9;
}
#count { color: #917b6f; font-size: 13px; }

footer {
  text-align: center;
  color: #9b8b7b;
  font-size: 11px;
  padding: 0 12px 25px;
}

@media (max-width: 600px) {
  header { padding-top: 23px; }
  .roof { height: 62px; }
  .gate-area { padding: 0 6px; margin-top: 16px; }
  .gate-frame { height: 64vh; min-height: 390px; border-width: 5px; }
  .person-reveal { inset: 5% 3%; }
  .person-content { width: 75%; padding: 12px 7px; }
  .handle { width: 54px; height: 54px; }
}
</style>
</head>

<body>
<header>
  <div class="eyebrow">DAILY HISTORY FACT</div>
  <h1>역사관의 문을 두드리다</h1>
  <div class="subtitle">문 너머에서 오늘의 역사를 만나보세요.</div>
</header>

<div class="roof"></div>

<main>
  <section class="gate-area">
    <div class="gate-frame" id="gateFrame">
      <div class="inside">
        <div>
          <h2>史</h2>
          <p>오늘의 역사 인물을 만나보세요.</p>
        </div>
      </div>

      <div class="door left"></div>
      <div class="door right"></div>

      <button class="handle" id="handle" aria-label="문고리 클릭"></button>

      <section class="person-reveal" id="personReveal" aria-live="polite">
        <img class="history-frame" src="./history-frame.png" alt="">
        <div class="person-content">
          <div class="person-label">TODAY'S HISTORICAL FIGURE</div>
          <h2 id="personName">오늘의 인물</h2>
          <div id="personPeriod"></div>
          <p id="personDescription"></p>
        </div>
      </section>
    </div>
  </section>

  <div class="instruction">
    <div id="instructionText">문고리를 세 번 클릭해 보세요.</div>
    <div id="count">두드린 횟수: 0 / 3</div>
  </div>
</main>

<footer>Made by 16기 역덕 for 지현T</footer>

<script>
const gateFrame = document.getElementById("gateFrame");
const handle = document.getElementById("handle");
const instructionText = document.getElementById("instructionText");
const count = document.getElementById("count");
const personReveal = document.getElementById("personReveal");

let knocks = 0;
let busy = false;

handle.addEventListener("click", async () => {
  if (busy) return;

  knocks++;
  count.textContent = `두드린 횟수: ${knocks} / 3`;

  gateFrame.animate([
    { transform: "translateX(0)" },
    { transform: "translateX(-4px)" },
    { transform: "translateX(4px)" },
    { transform: "translateX(0)" }
  ], { duration: 180 });

  if (knocks < 3) {
    instructionText.textContent =
      knocks === 1 ? "똑, 문 안에서 기척이 느껴집니다." :
      "똑, 마지막으로 한 번 더 두드려 보세요.";
    return;
  }

  busy = true;
  handle.disabled = true;
  instructionText.textContent = "역사의 문이 열립니다.";

  await new Promise(resolve => setTimeout(resolve, 500));
  gateFrame.classList.add("open");

  await new Promise(resolve => setTimeout(resolve, 1500));
  await revealPerson();
});

async function revealPerson() {
  try {
    const response = await fetch("./people.json");
    if (!response.ok) throw new Error("people.json을 읽을 수 없습니다.");

    const data = await response.json();
    const people = Array.isArray(data) ? data : data.people;

    if (!Array.isArray(people) || people.length === 0) {
      throw new Error("인물 데이터가 없습니다.");
    }

    const now = new Date();
    const dateKey = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, "0"),
      String(now.getDate()).padStart(2, "0")
    ].join("-");

    let person;

    try {
      if (localStorage.getItem("historyDate") === dateKey) {
        person = people.find(p =>
          p.name === localStorage.getItem("todayPerson")
        );
      }

      if (!person) {
        const previousName = localStorage.getItem("todayPerson");
        const choices = people.filter(p => p.name !== previousName);
        const pool = choices.length ? choices : people;
        person = pool[Math.floor(Math.random() * pool.length)];

        localStorage.setItem("historyDate", dateKey);
        localStorage.setItem("todayPerson", person.name);
      }
    } catch {
      person = people[Math.floor(Math.random() * people.length)];
    }

    document.getElementById("personName").textContent =
      person.name || "이름 정보 없음";

    document.getElementById("personPeriod").textContent =
      [person.era, person.birth_death].filter(Boolean).join(" · ");

    const activities = Array.isArray(person.major_activities)
      ? person.major_activities.join("\n")
      : person.major_activities;

    document.getElementById("personDescription").textContent =
      person.description ||
      person.contribution ||
      activities ||
      "인물 설명을 준비하고 있습니다.";

    personReveal.classList.add("show");
    instructionText.textContent = "오늘의 역사 인물을 만나보세요.";

  } catch (error) {
    console.error(error);
    instructionText.textContent =
      "인물 정보를 불러오지 못했습니다. people.json을 확인해 주세요.";
  }
}
</script>
</body>
</html>
