
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역사관의 문을 두드리다</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

:root {
  --ivory: #f5f0e7;
  --ink: #332d28;
  --brown: #6f3827;
  --gold: #c69a48;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: 'Noto Serif KR', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 16px 40px;
}

/* 상단 제목 */
header {
  text-align: center;
  margin-bottom: 24px;
}

.eyebrow {
  color: #8b765d;
  font-size: 11px;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  font-size: clamp(24px, 3vw, 38px);
  font-weight: 600;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-top: 10px;
  color: #8b7b69;
  font-size: 14px;
}

/* 전통 단청 처마 */
.roof {
  width: 100%;
  height: 24px;
  margin-bottom: 20px;
  background:
    repeating-linear-gradient(
      90deg,
      #173f32 0 24px,
      #c39b48 24px 30px,
      #a04432 30px 52px,
      #e2c77d 52px 58px,
      #173f32 58px 80px
    );
  border-top: 5px solid #6f3827;
  border-bottom: 5px solid #6f3827;
}

/* 문 전체 */
.gate-area {
  width: min(95vw, 1250px);
  height: clamp(420px, 65vh, 700px);
  position: relative;
  perspective: 1800px;
  transition: width .8s, height .8s;
}

.gate-frame {
  position: absolute;
  inset: 0;
  padding: 8px;
  border: 5px solid #6f3827;
  background: #c69a48;
  box-shadow:
    inset 0 0 0 3px #f0d99a,
    inset 0 0 0 7px #9c6933,
    0 18px 36px rgba(51,45,40,.18);
}

.gate {
  position: absolute;
  inset: 8px;
  display: flex;
  overflow: hidden;
  background: #174333;
  transform-style: preserve-3d;
}

/*
  palace-door.jpg는 두 번째 이미지 파일입니다.
  사진 전체를 좌우 절반으로 나눠 각 문짝에 표시합니다.
*/
.door {
  width: 50%;
  height: 100%;
  position: relative;
  background-image: url("palace-door.jpg");
  background-repeat: no-repeat;
  background-size: 200% 100%;
  border: 3px solid #d5b15d;
  box-shadow: inset 0 0 0 3px rgba(21,57,43,.35);
  transform-style: preserve-3d;
  transition: transform 1.6s cubic-bezier(.65,0,.25,1);
  overflow: hidden;
}

.door.left {
  background-position: left center;
  transform-origin: left center;
  border-right: 2px solid #e5c66e;
}

.door.right {
  background-position: right center;
  transform-origin: right center;
  border-left: 2px solid #e5c66e;
}

/* 사진 위에 얇은 금색 테두리 */
.door::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 2px solid rgba(224,190,104,.8);
  box-shadow: inset 0 0 0 2px rgba(22,60,44,.18);
  pointer-events: none;
}

/* 가운데 문고리 */
.knocker {
  position: absolute;
  top: 50%;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  z-index: 5;
  background: radial-gradient(
    circle at 35% 30%,
    #fff0b0,
    #e5bd59 45%,
    #9d6a24 80%
  );
  border: 4px double #fff0b0;
  box-shadow: 0 3px 8px rgba(0,0,0,.3);
  transform: translate(-50%, -50%);
  transition: opacity .3s, transform .3s;
}

.left .knocker {
  right: -27px;
}

.right .knocker {
  left: -27px;
}

.knocker::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 3px solid #80551f;
  border-radius: 50%;
}

.knocker::after {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: #70431c;
  border: 2px solid #f5d988;
  border-radius: 50%;
}

/* 세 번 두드린 뒤 문 확대 */
.gate-area.zoomed {
  width: min(98vw, 1450px);
  height: clamp(500px, 75vh, 850px);
}

.gate-area.zoomed .gate-frame {
  inset: -6px;
}

/* 양쪽 문이 바깥쪽으로 열림 */
.gate-area.open .door.left {
  transform: rotateY(-110deg);
}

.gate-area.open .door.right {
  transform: rotateY(110deg);
}

.gate-area.open .knocker {
  opacity: 0;
  transform: translate(-50%,-50%) scale(.5);
}

/* 두드리기 버튼 */
.controls {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.knock-button {
  background: var(--brown);
  color: #f8f0df;
  border: 1px solid #9b7148;
  padding: 14px 34px;
  font-size: 17px;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.knock-button:hover {
  background: #874832;
  transform: translateY(-2px);
}

.knock-button:disabled {
  opacity: .6;
  cursor: default;
}

.hint {
  font-size: 12px;
  color: #8b7b69;
}

/* 문이 열린 뒤 나타나는 인물 */
.person-card {
  display: none;
  width: min(90vw, 650px);
  margin-top: 32px;
  padding: 30px 22px;
  text-align: center;
  background: rgba(255,255,255,.45);
  border: 1px solid #d6c6ae;
  animation: appear .8s ease both;
}

.person-card.visible {
  display: block;
}

.person-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: #98764a;
}

.person-name {
  font-size: clamp(28px, 5vw, 42px);
  margin: 12px 0;
  font-weight: 700;
}

.person-description {
  font-size: 15px;
  line-height: 1.9;
  color: #62564a;
}

.home-button {
  display: none;
  margin-top: 20px;
  padding: 11px 24px;
  border: 1px solid #b7a38a;
  color: var(--brown);
  background: transparent;
  text-decoration: none;
}

.home-button:hover {
  background: #e9dfcf;
}

body.unlocked .controls {
  display: none;
}

body.unlocked .home-button {
  display: inline-block;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 모바일 */
@media (max-width: 600px) {
  .page {
    padding: 14px 7px 30px;
  }

  header {
    margin-bottom: 20px;
  }

  .roof {
    height: 18px;
    margin-bottom: 18px;
  }

  .gate-area {
    width: 97vw;
    height: 55vh;
    min-height: 380px;
  }

  .gate-frame {
    padding: 5px;
  }

  .gate {
    inset: 5px;
  }

  .door {
    border-width: 2px;
  }

  .door::after {
    inset: 5px;
  }

  .knocker {
    width: 42px;
    height: 42px;
  }

  .gate-area.zoomed {
    width: 99vw;
    height: 66vh;
    min-height: 440px;
  }

  .knock-button {
    padding: 12px 25px;
    font-size: 15px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="roof" aria-hidden="true"></div>

  <header>
    <div class="eyebrow">DAILY HISTORY FACT</div>
    <h1>역사관의 문을 두드리다</h1>
    <div class="subtitle">문 너머에서 오늘의 역사를 만나보세요.</div>
  </header>

  <section class="gate-area" id="gateArea" aria-label="궁궐의 전통 문">
    <div class="gate-frame">
      <div class="gate" id="gate">

        <div class="door left">
          <div class="knocker"></div>
        </div>

        <div class="door right">
          <div class="knocker"></div>
        </div>

      </div>
    </div>
  </section>

  <div class="controls" id="controls">
    <button class="knock-button" id="knockButton">
      문고리 두드리기 · 0 / 3
    </button>
    <div class="hint" id="hint">
      문고리를 세 번 두드려 보세요.
    </div>
  </div>

  <section class="person-card" id="personCard">
    <div class="person-label">TODAY'S HISTORICAL FIGURE</div>
    <div class="person-name">세종대왕</div>
    <div class="person-description">
      훈민정음 창제를 통해 백성이 쉽게 글을 익힐 수 있도록 했습니다.
    </div>
  </section>

  <a class="home-button" href="./home.html">
    홈페이지로 가기 →
  </a>

</main>

<script>
const gateArea = document.getElementById("gateArea");
const knockButton = document.getElementById("knockButton");
const hint = document.getElementById("hint");
const personCard = document.getElementById("personCard");

let knocks = 0;
let opening = false;

function knock() {
  if (opening) return;

  knocks++;

  knockButton.textContent =
    `문고리 두드리기 · ${knocks} / 3`;

  gateArea.animate(
    [
      { transform: "translateX(0)" },
      { transform: "translateX(-4px)" },
      { transform: "translateX(4px)" },
      { transform: "translateX(0)" }
    ],
    { duration: 220 }
  );

  if (knocks < 3) {
    hint.textContent = knocks === 1
      ? "첫 번째 두드림이 울려 퍼집니다."
      : "문 안쪽에서 인기척이 느껴집니다.";
    return;
  }

  opening = true;
  knockButton.disabled = true;
  hint.textContent = "역사의 문이 열립니다…";

  gateArea.classList.add("zoomed");

  setTimeout(() => {
    gateArea.classList.add("open");
  }, 650);

  setTimeout(() => {
    document.body.classList.add("unlocked");
    personCard.classList.add("visible");

    personCard.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }, 2100);
}

knockButton.addEventListener("click", knock);

gateArea.addEventListener("click", (event) => {
  if (!opening && event.target.closest(".door")) {
    knock();
  }
});
</script>

</body>
</html>
