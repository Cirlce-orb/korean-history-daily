<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사관의 문을 두드리다 | Daily History Fact</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
:root{--ivory:#f5f0e7;--ink:#332d28;--brown:#6f3827;--red:#9e3f2c;--green:#173d35;--gold:#c69a48;--goldlight:#e3c477;--muted:#8b7661}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Serif KR',serif;background:var(--ivory);color:var(--ink)}body{min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#fffaf1 0%,var(--ivory) 68%)}.stage{width:min(1100px,100%);min-height:min(760px,calc(100svh - 44px));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4vw,48px);border:1px solid #d8c8ae;outline:5px solid rgba(198,154,72,.12);background:rgba(255,252,245,.45);box-shadow:0 18px 55px rgba(66,45,27,.09);overflow:hidden}.roof{position:absolute;top:0;left:0;width:100%;height:clamp(84px,15vw,142px);pointer-events:none}.eave{position:absolute;inset:0;height:100%;background:var(--green);clip-path:polygon(12% 0,88% 0,100% 74%,0 74%);border-top:8px solid var(--gold);overflow:hidden}.eave:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 25px,rgba(198,154,72,.75) 26px 30px),linear-gradient(180deg,#173d35 0 66%,#9e3f2c 67% 73%,#d2a64f 74% 78%,#173d35 79%);opacity:.95}.ornament{position:absolute;top:56%;left:50%;transform:translateX(-50%);color:var(--goldlight);letter-spacing:.65em;white-space:nowrap;font-size:clamp(11px,2vw,19px)}.intro{z-index:1;width:min(680px,100%);margin-top:clamp(65px,11vw,110px);text-align:center}.eyebrow{font-size:.76rem;letter-spacing:.28em;color:var(--muted);margin-bottom:16px}h1{font-size:clamp(2rem,6.2vw,4.4rem);font-weight:500;letter-spacing:.06em;line-height:1.35;margin:0 0 18px}.subtitle{font-size:clamp(.9rem,2vw,1.08rem);line-height:1.9;color:#786753;margin:0 auto 30px}.gate-wrap{width:min(490px,94%);margin:0 auto 26px;position:relative}.gate{height:clamp(190px,31vw,290px);position:relative;overflow:hidden;border:7px solid var(--gold);background:linear-gradient(90deg,#e6d8bd,#f9f3e7 18%,#f9f3e7 82%,#e6d8bd);box-shadow:inset 0 0 0 3px var(--brown),0 9px 20px rgba(58,40,24,.12)}.gate-top{height:27px;background:repeating-linear-gradient(90deg,var(--green) 0 22px,var(--gold) 22px 26px,var(--red) 26px 43px,var(--gold) 43px 47px);border-bottom:4px solid var(--gold)}.door-leaf{position:absolute;top:31px;bottom:0;width:50%;background:linear-gradient(90deg,#f0e4d0,#e8d9bf);transition:transform .95s cubic-bezier(.2,.75,.2,1);border:2px solid #c49a54}.door-leaf.left{left:0;border-right:3px solid var(--gold)}.door-leaf.right{right:0;border-left:3px solid var(--gold)}.door-leaf:after{content:"";position:absolute;inset:12px;border:1px solid rgba(111,56,39,.45)}.knob{position:absolute;z-index:2;left:50%;top:58%;transform:translate(-50%,-50%);width:64px;height:64px;border:0;padding:0;border-radius:50%;background:radial-gradient(circle,#f2d58c 0 24%,#98652e 26% 34%,#f4d789 37% 43%,#6f3827 46% 70%,#d2a653 73% 79%,#6f3827 82%);box-shadow:0 3px 8px #6b4a2c55;transition:opacity .2s,transform .2s;cursor:pointer}.gate.open .door-leaf.left{transform:translateX(-102%)}.gate.open .door-leaf.right{transform:translateX(102%)}.gate.open .knob{opacity:0;transform:translate(-50%,-50%) scale(.65);pointer-events:none}.knock-hint{color:#927a5e;font-size:.88rem;margin:0}.knock-hint strong{color:var(--brown)}.knock-count{display:flex;justify-content:center;gap:8px;margin:12px 0 0}.knock-count span{width:7px;height:7px;border:1px solid var(--gold);border-radius:50%}.knock-count span.done{background:var(--gold)}.person-view{display:none;z-index:1;text-align:center;width:min(720px,100%);padding:clamp(25px,6vw,56px) 10px 20px;margin-top:clamp(70px,12vw,115px);animation:appear .7s ease both}.person-view.visible{display:block}.seal{width:58px;height:58px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;color:var(--gold);font-size:1.4rem}.person-view h2{font-weight:500;font-size:clamp(2rem,6vw,3.7rem);margin:0 0 8px;letter-spacing:.08em}.period{color:#8b7357;font-size:.92rem;margin-bottom:24px}.description{font-size:clamp(1rem,2.1vw,1.18rem);line-height:2;color:#5b4c3c;max-width:680px;margin:0 auto 28px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}button,.home-link{font:inherit;cursor:pointer;min-height:46px;border:1px solid var(--gold);padding:12px 23px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s}.home-link{background:var(--green);color:var(--ivory);border-color:var(--green)}.home-link:hover{background:#245247}.secondary{background:transparent;color:var(--brown)}.secondary:hover{background:#eee3d0}.foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#a08c73;font-size:.68rem;letter-spacing:.2em}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){body{padding:10px}.stage{min-height:calc(100svh - 20px);padding:18px 14px 34px}.roof{height:100px}.intro{margin-top:75px}.gate-wrap{margin-bottom:20px}.gate{height:200px}.foot{bottom:8px}.eyebrow{font-size:.65rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body><main class="stage">
<div class="roof" aria-hidden="true"><div class="eave"></div><div class="ornament">◆　✦　◆　✦　◆</div></div>
<section class="intro" id="intro"><div class="eyebrow">DAILY HISTORY FACT</div><h1>역사관의 문을 두드리다</h1><p class="subtitle">문고리를 세 번 눌러 오늘의 인물을 만나보세요.</p><div class="gate-wrap"><div class="gate" id="gate" aria-label="역사관 문"><div class="gate-top"></div><div class="door-leaf left"></div><div class="door-leaf right"></div><button class="knob" id="knob" aria-label="문고리 누르기"></button></div><p class="knock-hint" id="hint">문고리를 <strong>세 번</strong> 눌러 주세요.</p><div class="knock-count" aria-label="문고리 누른 횟수"><span></span><span></span><span></span></div></div></section>
<section class="person-view" id="personView" aria-live="polite"><div class="seal" aria-hidden="true">史</div><div class="eyebrow">TODAY'S HISTORICAL FIGURE</div><h2 id="personName">오늘의 인물</h2><div class="period" id="personPeriod"></div><p class="description" id="personDescription"></p><div class="actions"><a class="home-link" href="./index.html">홈페이지로 가기</a><button class="secondary" id="againButton" type="button">다시 문 두드리기</button></div></section>
<div class="foot">OUR HISTORY, ONE PERSON A DAY</div></main>
<script>
const gate=document.getElementById('gate'),knob=document.getElementById('knob'),intro=document.getElementById('intro'),personView=document.getElementById('personView'),hint=document.getElementById('hint'),dots=[...document.querySelectorAll('.knock-count span')];let knocks=0,opening=false;
// 실제 오늘의 인물 데이터 연결 전 표시되는 임시 예시입니다.
const featuredPerson={name:'오늘의 인물',period:'한국사의 인물을 만나보세요',description:'문이 열렸습니다. 홈페이지로 이동해 오늘의 인물을 확인해 보세요.'};
knob.addEventListener('click',()=>{if(opening||gate.classList.contains('open'))return;knocks++;dots[knocks-1].classList.add('done');gate.animate([{transform:'translateX(0)'},{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:150});if(knocks<3){hint.innerHTML=`좋아요. <strong>${3-knocks}번</strong> 더 눌러 주세요.`;return;}opening=true;hint.textContent='문이 열립니다…';gate.classList.add('open');window.setTimeout(()=>{intro.classList.add('hidden');document.getElementById('personName').textContent=featuredPerson.name;document.getElementById('personPeriod').textContent=featuredPerson.period;document.getElementById('personDescription').textContent=featuredPerson.description;personView.classList.add('visible');},950);});
document.getElementById('againButton').addEventListener('click',()=>{knocks=0;opening=false;dots.forEach(dot=>dot.classList.remove('done'));gate.classList.remove('open');personView.classList.remove('visible');intro.classList.remove('hidden');hint.innerHTML='문고리를 <strong>세 번</strong> 눌러 주세요.';});
</script></body></html>
