<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
:root {
  --paper: #f5f0e7;
  --ink: #332d28;
  --gold: #b89a5a;
  --brown: #684a36;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Serif KR', serif;
}
button, input, select { font: inherit; }
button { cursor: pointer; }

/* 첫 화면 */
#entry {
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  background:
    radial-gradient(ellipse at center, #fffaf0 0%, var(--paper) 72%);
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 5px;
  color: #8b7554;
  margin-bottom: 10px;
}
.entry-title {
  font-size: clamp(25px, 5vw, 43px);
  font-weight: 500;
  letter-spacing: 4px;
  margin: 0;
}
.entry-subtitle {
  font-size: 13px;
  color: #827568;
  margin: 12px 0 22px;
}
.door-stage {
  position: relative;
  width: min(76vw, 350px);
  height: min(52vh, 430px);
  min-height: 270px;
  perspective: 1000px;
  margin: 0 auto 18px;
}
.roof {
  position: absolute;
  z-index: 3;
  left: -9%;
  right: -9%;
  top: 0;
  height: 42px;
  background: #292b25;
  border: 3px solid #b99b61;
  border-radius: 50% 50% 4px 4px / 65% 65% 4px 4px;
  box-shadow: 0 5px 0 #483b2c;
}
.roof::before {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  top: 8px;
  height: 7px;
  background: repeating-linear-gradient(
    90deg, #bd9a56 0 8px, #9b4f3b 8px 16px,
    #52664c 16px 24px, #293d38 24px 32px
  );
}
.roof::after {
  content: "";
  position: absolute;
  left: -4%;
  right: -4%;
  bottom: -5px;
  height: 5px;
  background: #a4874f;
  border-radius: 50%;
}
.door-frame {
  position: absolute;
  top: 34px;
  bottom: 0;
  left: 5%;
  right: 5%;
  padding: 9px;
  background: linear-gradient(90deg, #8d6b3e, #d4b875, #75532f);
  border: 2px solid #634b2e;
  box-shadow: 0 12px 22px #49352230;
}
.door-inner {
  height: 100%;
  display: flex;
  overflow: hidden;
  border: 2px solid #5c4028;
  background: #322d26;
}
.door {
  position: relative;
  flex: 1;
  min-width: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 23px,
      #c2a267 24px 27px,
      #4e3828 28px 31px
    ),
    linear-gradient(90deg, #765337, #a57a4c 45%, #785235);
  border: 3px solid #4d3524;
  transition: transform 1.35s cubic-bezier(.65,0,.25,1);
  transform-origin: left center;
}
.door + .door {
  transform-origin: right center;
}
.door::before {
  content: "";
  position: absolute;
  inset: 12px 8px;
  border: 2px solid #d1b77a;
  box-shadow: inset 0 0 0 4px #62442c;
  background:
    repeating-linear-gradient(
      0deg, transparent 0 38px,
      #d0b274 39px 42px, #64462e 43px 47px
    );
}
.door::after {
  content: "";
  position: absolute;
  top: 8%;
  bottom: 8%;
  left: 50%;
  width: 3px;
  background: #d6bd80;
}
.handle {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%);
  width: 47px;
  height: 47px;
  border-radius: 50%;
  border: 5px double #f0d48a;
  background: radial-gradient(circle, #a77d35, #60421f);
  box-shadow: 0 0 0 3px #503720, 0 3px 8px #0008;
  color: #ffe6a2;
  display: grid;
  place-items: center;
  font-size: 22px;
  padding: 0;
}
.handle:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 5px;
}
.door-stage.open .door:first-child { transform: rotateY(-105deg); }
.door-stage.open .door:nth-child(2) { transform: rotateY(105deg); }
.door-stage.open .handle {
  opacity: 0;
  transition: opacity .3s;
}
.entry-instruction {
  font-size: 13px;
  color: #6f5d49;
  margin: 0;
}
.click-count {
  font-size: 12px;
  color: #9b8668;
  margin-top: 8px;
}
.reveal {
  position: absolute;
  z-index: 2;
  inset: 43px 10% 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .8s .45s;
  pointer-events: none;
  padding: 15px;
}
.door-stage.open .reveal { opacity: 1; }
.reveal-card {
  width: 100%;
  max-height: 100%;
  overflow: hidden;
  padding: 15px 10px;
  border: 3px double var(--gold);
  outline: 1px solid #8d6d38;
  outline-offset: 4px;
  background: #f9f1dcf5;
  box-shadow: 0 8px 24px #0003;
}
.reveal-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #8a6b37;
}
#revealName {
  font-size: clamp(19px, 4vw, 29px);
  margin: 10px 0;
  overflow-wrap: anywhere;
}
#revealDescription {
  font-size: 12px;
  line-height: 1.8;
  margin: 0;
}
.entry-footer {
  font-size: 10px;
  color: #9a8c79;
  letter-spacing: 1px;
  margin-top: 14px;
}
#entry.entered { display: none; }

/* 기존 홈페이지 영역 */
#homePage { display: none; }
#homePage.active { display: block; }
.site-header {
  padding: 26px 20px 22px;
  border-bottom: 1px solid #ded3c1;
  text-align: center;
}
.site-header h1 {
  margin: 0;
  font-size: clamp(23px, 4vw, 34px);
  font-weight: 500;
}
.site-header p {
  margin: 8px 0 0;
  font-size: 12px;
  color: #837466;
}
.page-content {
  max-width: 1050px;
  margin: auto;
  padding: 25px 20px 60px;
}
.today-section {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
  gap: 26px;
  align-items: center;
  padding: 25px;
  border: 1px solid #d9c9a9;
  background: #fbf8f1;
}
.today-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: #92784c;
}
.today-section h2 {
  font-size: clamp(25px, 4vw, 37px);
  font-weight: 500;
  margin: 12px 0 5px;
}
.person-period {
  color: #8b7967;
  font-size: 12px;
}
.person-description {
  line-height: 1.95;
  font-size: 14px;
  white-space: pre-line;
}
.person-photo {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: #e9dfce;
  border: 1px solid #d2c2a3;
  display: block;
}
.photo-placeholder {
  display: grid;
  place-items: center;
  min-height: 200px;
  color: #8d7a61;
  font-size: 42px;
}
.section-heading {
  margin: 40px 0 15px;
  font-size: 22px;
  font-weight: 500;
}
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.filters input, .filters select {
  min-width: 0;
  padding: 12px;
  border: 1px solid #d7cbb9;
  background: #fffdf8;
  color: var(--ink);
}
.filters input { flex: 1; }
.people-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 17px;
}
.person-card {
  border: 1px solid #e0d5c4;
  background: #fbf8f1;
  padding: 10px;
  text-align: left;
  color: var(--ink);
  transition: transform .15s, box-shadow .15s;
}
.person-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px #49352212;
}
.person-card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
  display: block;
  background: #e8dfd0;
}
.person-card h3 {
  font-size: 17px;
  font-weight: 500;
  margin: 12px 0 5px;
}
.person-card p {
  font-size: 11px;
  color: #8a7865;
  margin: 0 0 8px;
}
.person-card .card-description {
  font-size: 12px;
  line-height: 1.7;
  color: #554a3f;
}
.small-button {
  padding: 9px 13px;
  background: transparent;
  border: 1px solid #bca984;
  color: #6b5538;
  font-size: 12px;
}
.back-row { text-align: center; margin-top: 35px; }
.site-footer {
  text-align: center;
  border-top: 1px solid #ded3c1;
  padding: 20px;
  color: #948573;
  font-size: 11px;
}
.status-message {
  color: #887663;
  font-size: 13px;
  line-height: 1.8;
}
@media (max-width: 600px) {
  .today-section {
    grid-template-columns: 1fr;
    padding: 17px;
  }
  .today-photo-wrap {
    max-width: 260px;
    width: 100%;
    margin: auto;
  }
  .filters { flex-direction: column; }
  .people-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .person-card img { height: 150px; }
  .page-content { padding: 18px 13px 40px; }
}
</style>
</head>

<body>
<section id="entry">
  <div class="eyebrow">DAILY HISTORY FACT</div>
  <h1 class="entry-title">역사관의 문을 두드리다</h1>
  <p class="entry-subtitle">오늘 만날 한국사의 인물을 찾아서</p>

  <div class="door-stage" id="doorStage">
    <div class="roof"></div>
    <div class="door-frame">
      <div class="door-inner">
        <div class="door"></div>
        <div class="door"></div>
      </div>
    </div>
    <div class="reveal">
      <div class="reveal-card">
        <div class="reveal-label">TODAY'S HISTORICAL FIGURE</div>
        <h2 id="revealName">오늘의 인물</h2>
        <p id="revealDescription">역사의 문을 열어 보세요.</p>
      </div>
    </div>
    <button class="handle" id="doorHandle" aria-label="문고리 누르기">◉</button>
  </div>

  <p class="entry-instruction" id="entryInstruction">문고리를 세 번 눌러 보세요.</p>
  <p class="click-count" id="clickCount">0 / 3</p>
  <div class="entry-footer">MADE BY 16기 역덕 FOR 지현T</div>
</section>

<main id="homePage">
  <header class="site-header">
    <h1>1일 1한국사 인물</h1>
    <p>역사 속 인물과 그들이 남긴 이야기</p>
  </header>

  <div class="page-content">
    <section class="today-section">
      <div>
        <div class="today-label">TODAY'S HISTORICAL FIGURE</div>
        <h2 id="personName">인물을 불러오는 중</h2>
        <div class="person-period" id="personPeriod"></div>
        <p class="person-description" id="personDescription"></p>
      </div>
      <div class="today-photo-wrap">
        <img class="person-photo" id="todayPhoto" alt="오늘의 역사 인물"
             style="display:none">
        <div class="person-photo photo-placeholder" id="todayPhotoPlaceholder">史</div>
      </div>
    </section>

    <h2 class="section-heading">한국사 인물 찾아보기</h2>
    <div class="filters">
      <input id="search" type="search" placeholder="인물 이름이나 설명 검색">
      <select id="era">
        <option value="">전체 시대</option>
      </select>
    </div>
    <div id="loadMessage" class="status-message"></div>
    <div class="people-grid" id="people"></div>

    <div class="back-row">
      <button class="small-button" id="backToDoor">처음 화면으로</button>
    </div>
  </div>

  <footer class="site-footer">Made by 16기 역덕 for 지현T</footer>
</main>

<script>
let peopleData = [];
let todayPerson = null;
let clickCount = 0;
let transitionStarted = false;

const $ = id => document.getElementById(id);

function getDescription(person) {
  return person.description || person.contribution || person.summary || "";
}

function getPeriod(person) {
  return [person.era, person.birth_death].filter(Boolean).join(" · ");
}

function getSearchText(person) {
  return [
    person.name, person.era, person.birth_death,
    getDescription(person), ...(person.major_activities || [])
  ].join(" ").toLowerCase();
}

function getTodayPerson(list) {
  const today = new Date();
  const dateKey = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")
  ].join("-");

  try {
    const savedDate = localStorage.getItem("historyDate");
    const savedName = localStorage.getItem("todayPerson");

    if (savedDate === dateKey && savedName) {
      const savedPerson = list.find(p => p.name === savedName);
      if (savedPerson) return savedPerson;
    }

    let used = JSON.parse(localStorage.getItem("historyPeople") || "[]");
    let remaining = list.filter(p => !used.includes(p.name));

    if (!remaining.length) {
      used = [];
      remaining = list.slice();
    }

    const chosen = remaining[Math.floor(Math.random() * remaining.length)];
    used.push(chosen.name);

    localStorage.setItem("historyPeople", JSON.stringify(used));
    localStorage.setItem("historyDate", dateKey);
    localStorage.setItem("todayPerson", chosen.name);

    return chosen;
  } catch (error) {
    return list[Math.floor(Math.random() * list.length)];
  }
}

function imageSearchTitle(person) {
  return person.image_title || person.wikipedia_title || person.name;
}

async function loadPersonImage(person, imageElement, placeholder) {
  if (!person || !imageElement || !placeholder) return;

  const directImage = person.image || person.image_url || person.imageUrl;
  if (directImage) {
    imageElement.onload = () => {
      imageElement.style.display = "block";
      placeholder.style.display = "none";
    };
    imageElement.onerror = () => {
      imageElement.style.display = "none";
      placeholder.style.display = "grid";
    };
    imageElement.src = directImage;
    return;
  }

  imageElement.style.display = "none";
  placeholder.style.display = "grid";
  placeholder.textContent = (person.name || "史").charAt(0);

  try {
    const title = imageSearchTitle(person);
    const url = "https://ko.wikipedia.org/w/api.php?action=query&format=json" +
      "&formatversion=2&prop=pageimages&piprop=thumbnail&pithumbsize=700" +
      "&generator=search&gsrsearch=" + encodeURIComponent(title) +
      "&gsrlimit=5&origin=*";

    const response = await fetch(url);
    if (!response.ok) throw new Error("이미지 요청 실패");

    const data = await response.json();
    const pages = data.query && data.query.pages ? data.query.pages : [];
    const page = pages.find(p => p.thumbnail && p.thumbnail.source);

    if (page) {
      imageElement.onload = () => {
        imageElement.style.display = "block";
        placeholder.style.display = "none";
      };
      imageElement.onerror = () => {
        imageElement.style.display = "none";
        placeholder.style.display = "grid";
      };
      imageElement.src = page.thumbnail.source;
    }
  } catch (error) {
    console.warn("인물 이미지를 불러오지 못했습니다.", error);
  }
}

function displayToday(person) {
  if (!person) return;
  todayPerson = person;

  $("personName").textContent = person.name || "이름 미상";
  $("personPeriod").textContent = getPeriod(person);
  $("personDescription").textContent = getDescription(person);

  loadPersonImage(person, $("todayPhoto"), $("todayPhotoPlaceholder"));
}

function renderEraOptions() {
  const select = $("era");
  const eras = [...new Set(peopleData.map(p => p.era).filter(Boolean))];

  select.innerHTML = '<option value="">전체 시대</option>';
  eras.forEach(era => {
    const option = document.createElement("option");
    option.value = era;
    option.textContent = era;
    select.appendChild(option);
  });
}

function renderPeople() {
  const keyword = $("search").value.trim().toLowerCase();
  const era = $("era").value;
  const container = $("people");

  container.replaceChildren();

  const filtered = peopleData.filter(person =>
    (!keyword || getSearchText(person).includes(keyword)) &&
    (!era || person.era === era)
  );

  if (!filtered.length) {
    $("loadMessage").textContent = "검색 결과가 없습니다.";
    return;
  }

  $("loadMessage").textContent = `총 ${filtered.length}명의 인물`;

  filtered.forEach(person => {
    const card = document.createElement("button");
    card.className = "person-card";
    card.type = "button";

    const img = document.createElement("img");
    img.alt = person.name || "역사 인물";
    img.loading = "lazy";

    const placeholder = document.createElement("div");
    placeholder.className = "photo-placeholder";
    placeholder.style.height = "190px";
    placeholder.textContent = (person.name || "史").charAt(0);

    const title = document.createElement("h3");
    title.textContent = person.name || "이름 미상";

    const period = document.createElement("p");
    period.textContent = getPeriod(person);

    const description = document.createElement("div");
    description.className = "card-description";
    const summary = getDescription(person);
    description.textContent = summary.length > 75
      ? summary.slice(0, 75) + "…" : summary;

    const imageWrap = document.createElement("div");
    imageWrap.append(img, placeholder);

    img.style.display = "none";
    placeholder.style.display = "grid";

    loadPersonImage(person, img, placeholder);

    card.append(imageWrap, title, period, description);
    card.addEventListener("click", () => {
      displayToday(person);
      window.scrollTo({ top: 0, behavior: "smooth" });
      $("personName").focus?.();
    });

    container.appendChild(card);
  });
}

function openHome() {
  $("entry").classList.add("entered");
  $("homePage").classList.add("active");
  displayToday(todayPerson);
  window.scrollTo({ top: 0, behavior: "instant" });
}

$("doorHandle").addEventListener("click", () => {
  if (transitionStarted) return;

  clickCount++;
  $("clickCount").textContent = `${Math.min(clickCount, 3)} / 3`;

  if (clickCount >= 3) {
    transitionStarted = true;
    $("doorStage").classList.add("open");
    $("entryInstruction").textContent = "역사의 문이 열렸습니다.";
    $("clickCount").textContent = "";

    if (todayPerson) {
      $("revealName").textContent = todayPerson.name || "오늘의 인물";
      $("revealDescription").textContent = getDescription(todayPerson);
    }

    setTimeout(openHome, 2300);
  }
});

$("search").addEventListener("input", renderPeople);
$("era").addEventListener("change", renderPeople);

$("backToDoor").addEventListener("click", () => {
  $("homePage").classList.remove("active");
  $("entry").classList.remove("entered");
  $("doorStage").classList.remove("open");
  clickCount = 0;
  transitionStarted = false;
  $("clickCount").textContent = "0 / 3";
  $("entryInstruction").textContent = "문고리를 세 번 눌러 보세요.";
  window.scrollTo({ top: 0, behavior: "instant" });
});

async function initializePage() {
  try {
    const response = await fetch("./people.json");
    if (!response.ok) throw new Error("people.json을 불러오지 못했습니다.");

    const data = await response.json();
    peopleData = Array.isArray(data) ? data : data.people;

    if (!Array.isArray(peopleData) || !peopleData.length) {
      throw new Error("people.json에 인물 목록이 없습니다.");
    }

    todayPerson = getTodayPerson(peopleData);
    $("revealName").textContent = todayPerson.name || "오늘의 인물";
    $("revealDescription").textContent = getDescription(todayPerson);

    renderEraOptions();
    displayToday(todayPerson);
    renderPeople();
  } catch (error) {
    console.error(error);
    $("loadMessage").textContent =
      "인물 정보를 불러오지 못했습니다. people.json 파일과 JSON 형식을 확인해 주세요.";
    $("revealName").textContent = "인물 정보를 불러오지 못했습니다";
    $("revealDescription").textContent =
      "GitHub Pages에 people.json 파일이 있는지 확인해 주세요.";
  }
}

initializePage();
</script>
</body>
</html>
