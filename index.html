
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사관의 문을 두드리다</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f0e7;
  --ink: #332d28;
  --gold: #c4a45e;
}
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif KR", serif;
}

.page {
  width: 100%;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  flex: 0 0 auto;
  text-align: center;
  padding: clamp(8px, 2vh, 22px) 10px 12px;
}
.eyebrow {
  color: #9b8469;
  font-size: 10px;
  letter-spacing: 4px;
}
h1 {
  font-size: clamp(23px, 3.2vw, 38px);
  font-weight: 500;
  margin: 7px 0;
}
.subtitle {
  color: #8d7d6d;
  font-size: clamp(11px, 1.2vw, 14px);
}

/* 단청 */
.roof {
  flex: 0 0 auto;
  width: 100%;
  height: clamp(35px, 7vh, 68px);
  background:
    repeating-linear-gradient(90deg, transparent 0 17px, #d7b66a 17px 21px, transparent 21px 38px),
    repeating-linear-gradient(45deg, transparent 0 19px, #d7b66a 19px 23px, #9d4131 23px 27px, transparent 27px 39px),
    repeating-linear-gradient(-45deg, #193e32 0 22px, #d7b66a 22px 26px, #193e32 26px 42px);
  border-bottom: 8px solid #70402c;
  box-shadow: 0 3px 0 #d9cdbd;
}

/* 문 영역 */
.gate-area {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  padding: clamp(8px, 1.6vh, 16px) clamp(8px, 1.5vw, 18px) 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
}

.gate-frame {
  position: relative;
  width: min(100%, 1100px);
  height: 100%;
  min-height: 0;
  overflow: hidden;
  perspective: 1200px;
  background: radial-gradient(ellipse, #d9c38c, #385744 65%, #19362c);
  border: 6px solid #70402c;
  outline: 2px solid var(--gold);
  box-shadow: inset 0 0 0 4px #e6cc85;
}

.inside {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  color: #fff0c9;
}
.inside h2 {
  margin: 0;
  font-size: clamp(30px, 5vw, 55px);
  font-weight: 400;
  letter-spacing: 8px;
}
.inside p { font-size: 12px; }

.door {
  position: absolute;
  z-index: 2;
  top: 0;
  width: 50%;
  height: 100%;
  background-image: url("./palace-door.png");
  background-repeat: no-repeat;
  background-size: 200% 100%;
  transition: transform 1.4s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}
.door.left {
  left: 0;
  background-position: left center;
  transform-origin: left center;
  border-right: 2px solid #d5b66c;
}
.door.right {
  right: 0;
  background-position: right center;
  transform-origin: right center;
  border-left: 2px solid #d5b66c;
}
.gate-frame.open .door.left { transform: rotateY(-110deg); }
.gate-frame.open .door.right { transform: rotateY(110deg); }

/* 문고리 */
.handle {
  position: absolute;
  z-index: 5;
  top: 44%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 53px;
  height: 53px;
  border-radius: 50%;
  border: 3px solid #f2d68a;
  background: radial-gradient(circle at 35% 30%, #fff1b4, #c69a43 65%, #795229);
  box-shadow: 0 0 0 2px #795229, inset 0 0 0 4px #f8e4a2;
  cursor: pointer;
}
.handle::after {
  content: "";
  position: absolute;
  inset: 13px;
  border: 2px solid #795229;
  border-radius: 50%;
}
.gate-frame.open .handle {
  opacity: 0;
  pointer-events: none;
}

/* 중앙 인물 카드 */
.person-reveal {
  position: absolute;
  z-index: 4;
  inset: 4% 6%;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(.75);
  pointer-events: none;
  transition: opacity .9s ease, transform .9s ease;
}
.person-reveal.show {
  opacity: 1;
  transform: scale(1);
}
.gold-frame {
  position: absolute;
  inset: 0;
  border: 2px solid #c4a45e;
  outline: 1px solid #e5cf91;
  outline-offset: -8px;
  pointer-events: none;
}
.gold-frame::before,
.gold-frame::after {
  content: "✦";
  position: absolute;
  color: #b3914d;
  font-size: 22px;
  top: 8px;
}
.gold-frame::before { left: 10px; }
.gold-frame::after { right: 10px; }

.corner {
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2px solid #b3914d;
  border-radius: 50%;
}
.corner.tl { top: 5px; left: 5px; }
.corner.tr { top: 5px; right: 5px; }
.corner.bl { bottom: 5px; left: 5px; }
.corner.br { bottom: 5px; right: 5px; }

.person-content {
  position: relative;
  z-index: 1;
  width: 76%;
  max-height: 76%;
  overflow: auto;
  text-align: center;
  padding: 15px 12px;
  color: #403321;
  background: rgba(255, 250, 235, .94);
}
.person-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #947744;
}
#personName {
  margin: 8px 0;
  font-size: clamp(20px, 3vw, 34px);
  font-weight: 500;
}
#personPeriod {
  font-size: 11px;
  color: #7b6b56;
}
#personDescription {
  margin: 10px auto 0;
  font-size: clamp(11px, 1.3vw, 14px);
  line-height: 1.7;
  white-space: pre-line;
}

.instruction {
  flex: 0 0 auto;
  text-align: center;
  padding: 8px 8px 4px;
  font-size: 12px;
  line-height: 1.6;
}
#count { color: #917b6f; font-size: 10px; }

.footer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 5px 10px max(7px, env(safe-area-inset-bottom));
  font-size: 10px;
  color: #9b8b7b;
}
.home-button {
  font-family: inherit;
  font-size: 11px;
  padding: 5px 12px;
  background: #354b3d;
  color: #f5f0e7;
  border: 1px solid var(--gold);
  cursor: pointer;
}
.home-button:hover { background: #526a56; }

@media (max-height: 600px) {
  header { padding: 5px 8px; }
  h1 { font-size: 22px; margin: 4px 0; }
  .roof { height: 30px; }
  .instruction { padding: 4px; }
  .gate-area { padding-top: 7px; }
  .handle { width: 43px; height: 43px; }
  .handle::after { inset: 10px; }
}
</style>
</head>

<body>
<div class="page">
  <header>
    <div class="eyebrow">DAILY HISTORY FACT</div>
    <h1>역사관의 문을 두드리다</h1>
    <div class="subtitle">문 너머에서 오늘의 역사를 만나보세요.</div>
  </header>

  <div class="roof"></div>

  <main class="gate-area">
    <div class="gate-frame" id="gateFrame">
      <div class="inside">
        <div>
          <h2>史</h2>
          <p>오늘의 역사 인물을 만나보세요.</p>
        </div>
      </div>

      <div class="door left"></div>
      <div class="door right"></div>
      <button class="handle" id="handle" aria-label="문고리 클릭"></button>

      <section class="person-reveal" id="personReveal" aria-live="polite">
        <div class="gold-frame">
          <i class="corner tl"></i>
          <i class="corner tr"></i>
          <i class="corner bl"></i>
          <i class="corner br"></i>
        </div>
        <div class="person-content">
          <div class="person-label">TODAY'S HISTORICAL FIGURE</div>
          <h2 id="personName">오늘의 인물</h2>
          <div id="personPeriod"></div>
          <p id="personDescription"></p>
        </div>
      </section>
    </div>
  </main>

  <div class="instruction">
    <div id="instructionText">문고리를 세 번 클릭해 보세요.</div>
    <div id="count">두드린 횟수: 0 / 3</div>
  </div>

  <footer class="footer">
    <span>Made by 16기 역덕 for 지현T</span>
    <button class="home-button" id="homeButton">홈페이지로 가기</button>
  </footer>
</div>

<script>
const gateFrame = document.getElementById("gateFrame");
const handle = document.getElementById("handle");
const instructionText = document.getElementById("instructionText");
const count = document.getElementById("count");
const personReveal = document.getElementById("personReveal");
const homeButton = document.getElementById("homeButton");

let knocks = 0;
let busy = false;

handle.addEventListener("click", async () => {
  if (busy) return;
  knocks++;

  count.textContent = `두드린 횟수: ${knocks} / 3`;

  gateFrame.animate([
    { transform: "translateX(0)" },
    { transform: "translateX(-4px)" },
    { transform: "translateX(4px)" },
    { transform: "translateX(0)" }
  ], { duration: 180 });

  if (knocks < 3) {
    instructionText.textContent =
      knocks === 1 ? "똑, 문 안에서 기척이 느껴집니다." :
      "똑, 마지막으로 한 번 더 두드려 보세요.";
    return;
  }

  busy = true;
  handle.disabled = true;
  instructionText.textContent = "역사의 문이 열립니다.";

  await new Promise(resolve => setTimeout(resolve, 450));
  gateFrame.classList.add("open");

  await new Promise(resolve => setTimeout(resolve, 1400));
  await revealPerson();
});

async function revealPerson() {
  try {
    const response = await fetch("./people.json");
    if (!response.ok) throw new Error("people.json을 읽을 수 없습니다.");

    const data = await response.json();
    const people = Array.isArray(data) ? data : data.people;
    if (!Array.isArray(people) || people.length === 0) {
      throw new Error("인물 데이터가 없습니다.");
    }

    const now = new Date();
    const dateKey = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, "0"),
      String(now.getDate()).padStart(2, "0")
    ].join("-");

    let person;

    try {
      if (localStorage.getItem("historyDate") === dateKey) {
        person = people.find(p => p.name === localStorage.getItem("todayPerson"));
      }

      if (!person) {
        const previousName = localStorage.getItem("todayPerson");
        const choices = people.filter(p => p.name !== previousName);
        const pool = choices.length ? choices : people;
        person = pool[Math.floor(Math.random() * pool.length)];

        localStorage.setItem("historyDate", dateKey);
        localStorage.setItem("todayPerson", person.name);
      }
    } catch {
      person = people[Math.floor(Math.random() * people.length)];
    }

    document.getElementById("personName").textContent =
      person.name || "이름 정보 없음";
    document.getElementById("personPeriod").textContent =
      [person.era, person.birth_death].filter(Boolean).join(" · ");

    const activities = Array.isArray(person.major_activities)
      ? person.major_activities.join("\n")
      : person.major_activities;

    document.getElementById("personDescription").textContent =
      person.description || person.contribution || activities ||
      "인물 설명을 준비하고 있습니다.";

    personReveal.classList.add("show");
    instructionText.textContent = "오늘의 역사 인물을 만나보세요.";
  } catch (error) {
    console.error(error);
    instructionText.textContent = "인물 정보를 불러오지 못했습니다. people.json을 확인해 주세요.";
  }
}

homeButton.addEventListener("click", () => {
  knocks = 0;
  busy = false;
  gateFrame.classList.remove("open");
  personReveal.classList.remove("show");
  handle.disabled = false;
  count.textContent = "두드린 횟수: 0 / 3";
  instructionText.textContent = "문고리를 세 번 클릭해 보세요.";
});
</script>
</body>
</html>
