
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역사관의 문을 두드리다</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #f5f0e7;
  --ink: #332d28;
  --brown: #917b6f;
  --line: #d9cdbb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif KR", serif;
}

header {
  text-align: center;
  padding: 35px 18px 20px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--brown);
}

h1 {
  font-size: clamp(25px, 5vw, 42px);
  font-weight: 500;
  margin: 12px 0;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 14px;
  color: #75695f;
}

/* 궁궐 처마 장식 */
.roof {
  position: relative;
  width: min(900px, 94%);
  height: 85px;
  margin: 0 auto;
  overflow: hidden;
}

.roof-top {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 10px;
  height: 38px;
  background: #263f36;
  border: 4px solid #b18a4d;
  border-radius: 50% 50% 4px 4px / 70% 70% 4px 4px;
}

.roof-top::before {
  content: "";
  position: absolute;
  inset: 6px 10px;
  border: 2px solid #d7bd7d;
  border-radius: inherit;
}

.roof-bottom {
  position: absolute;
  left: 0;
  right: 0;
  top: 43px;
  height: 22px;
  background: repeating-linear-gradient(
    90deg,
    #9a3430 0 18px,
    #d1ad60 18px 24px,
    #24483b 24px 42px,
    #d1ad60 42px 48px
  );
  border: 3px solid #b18a4d;
  clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%);
}

.roof-shadow {
  position: absolute;
  bottom: 7px;
  left: 8%;
  right: 8%;
  height: 5px;
  background: #8e7553;
  border-radius: 50%;
}

/* 문 */
.gate-scene {
  width: min(620px, 92vw);
  margin: 0 auto;
  perspective: 1200px;
}

.gate-frame {
  position: relative;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 1.25 / 1;
  background: #253d32;
  border: 10px solid #795537;
  outline: 2px solid #c3a16a;
  box-shadow: 0 18px 35px #4a35251f;
}

.door {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  background-image: url("./palace-door.png");
  background-repeat: no-repeat;
  background-size: 200% 100%;
  transition:
    transform 1.5s cubic-bezier(.2,.7,.2,1),
    filter 0.8s ease;
  will-change: transform;
}

.door.left {
  left: 0;
  background-position: left center;
  transform-origin: left center;
  border-right: 2px solid #c9a765;
}

.door.right {
  right: 0;
  background-position: right center;
  transform-origin: right center;
  border-left: 2px solid #c9a765;
}

.gate-frame.zoomed .door {
  filter: brightness(1.08);
}

.gate-frame.open .door.left {
  transform: rotateY(-105deg);
}

.gate-frame.open .door.right {
  transform: rotateY(105deg);
}

/* 문 안쪽 공간 */
.inside {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at center, #f4e2b4 0%, #b5a17b 42%, #354c3e 100%);
}

.inside-text {
  text-align: center;
  color: #332d28;
  padding: 20px;
}

.inside-text .hanja {
  font-size: clamp(30px, 7vw, 58px);
  letter-spacing: 8px;
}

.inside-text p {
  font-size: 14px;
}

.door-handle {
  position: absolute;
  z-index: 2;
  top: 48%;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #d9b96e;
  border: 2px solid #76572e;
}

.door-handle.left { left: calc(50% - 22px); }
.door-handle.right { right: calc(50% - 22px); }

.gate-frame.open .door-handle {
  opacity: 0;
}

.instructions {
  margin: 27px auto 12px;
  text-align: center;
  font-size: 15px;
  line-height: 1.9;
}

#knockCount {
  color: var(--brown);
  font-size: 13px;
  min-height: 22px;
}

button {
  display: block;
  margin: 12px auto 35px;
  padding: 13px 32px;
  color: var(--paper);
  background: #354b3d;
  border: 1px solid #b69b68;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

button:hover {
  background: #526a56;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .6;
  cursor: default;
}

/* 역사 인물 */
#personCard {
  display: none;
  width: min(700px, 90%);
  margin: 20px auto 70px;
  padding: 28px 24px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: center;
  animation: reveal 1s ease both;
}

#personCard.show { display: block; }

.person-label {
  font-size: 12px;
  color: var(--brown);
  letter-spacing: 3px;
}

#personName {
  font-size: clamp(25px, 5vw, 36px);
  font-weight: 500;
  margin: 14px 0 8px;
}

#personPeriod {
  color: #817469;
  font-size: 13px;
}

#personDescription {
  font-size: 15px;
  line-height: 2;
  margin: 22px auto 0;
  max-width: 560px;
  white-space: pre-line;
}

footer {
  text-align: center;
  padding: 0 16px 25px;
  color: #9a8c7d;
  font-size: 11px;
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  header { padding-top: 25px; }
  .roof { height: 70px; }
  .gate-frame { border-width: 7px; }
  .instructions { font-size: 14px; }
}
</style>
</head>

<body>
<header>
  <div class="eyebrow">KOREAN HISTORY ARCHIVE</div>
  <h1>역사관의 문을 두드리다</h1>
  <div class="subtitle">문 너머에서 오늘의 역사를 만나다</div>
</header>

<div class="roof" aria-hidden="true">
  <div class="roof-top"></div>
  <div class="roof-bottom"></div>
  <div class="roof-shadow"></div>
</div>

<main>
  <section class="gate-scene" aria-label="역사관의 문">
    <div class="gate-frame" id="gateFrame">
      <div class="inside">
        <div class="inside-text">
          <div class="hanja">史</div>
          <p>기억 속의 역사를 만나다</p>
        </div>
      </div>

      <div class="door left"></div>
      <div class="door right"></div>
      <div class="door-handle left"></div>
      <div class="door-handle right"></div>
    </div>
  </section>

  <section class="instructions">
    <div id="instructionText">문을 세 번 두드려 보세요.</div>
    <div id="knockCount">두드린 횟수: 0 / 3</div>
  </section>

  <button id="knockButton" type="button">문 두드리기 · 0/3</button>

  <section id="personCard" aria-live="polite">
    <div class="person-label">TODAY'S HISTORICAL FIGURE</div>
    <h2 id="personName">오늘의 인물</h2>
    <div id="personPeriod"></div>
    <p id="personDescription"></p>
  </section>
</main>

<footer>Made by 16기 역덕 for 지현T</footer>

<script>
const gateFrame = document.getElementById("gateFrame");
const knockButton = document.getElementById("knockButton");
const knockCount = document.getElementById("knockCount");
const instructionText = document.getElementById("instructionText");
const personCard = document.getElementById("personCard");

let knocks = 0;
let isOpening = false;

function knock() {
  if (isOpening || knocks >= 3) return;

  knocks++;

  knockCount.textContent = `두드린 횟수: ${knocks} / 3`;
  knockButton.textContent = `문 두드리기 · ${knocks}/3`;

  gateFrame.animate(
    [
      { transform: "translateX(0)" },
      { transform: "translateX(-4px)" },
      { transform: "translateX(4px)" },
      { transform: "translateX(0)" }
    ],
    { duration: 180, easing: "ease-out" }
  );

  if (knocks < 3) {
    instructionText.textContent =
      knocks === 1 ? "안에서 기척이 느껴집니다." : "문 안쪽에서 소리가 들립니다.";
    return;
  }

  isOpening = true;
  knockButton.disabled = true;
  instructionText.textContent = "역사의 문이 열립니다.";

  gateFrame.classList.add("zoomed");

  setTimeout(() => {
    gateFrame.classList.add("open");
  }, 700);

  setTimeout(() => {
    showTodayPerson();
  }, 1800);
}

async function showTodayPerson() {
  try {
    const response = await fetch("./people.json");

    if (!response.ok) {
      throw new Error("people.json을 불러오지 못했습니다.");
    }

    const data = await response.json();
    const people = Array.isArray(data) ? data : data.people;

    if (!Array.isArray(people) || people.length === 0) {
      throw new Error("people.json에 인물 데이터가 없습니다.");
    }

    const today = new Date();
    const dateKey = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, "0"),
      String(today.getDate()).padStart(2, "0")
    ].join("-");

    let selected;

    try {
      const savedDate = localStorage.getItem("historyDate");
      const savedPerson = localStorage.getItem("todayPerson");

      if (savedDate === dateKey && savedPerson) {
        selected = people.find(person =>
          person.name === savedPerson
        );
      }

      if (!selected) {
        const lastName = localStorage.getItem("todayPerson");
        const choices = people.filter(person =>
          person.name !== lastName
        );
        const pool = choices.length ? choices : people;

        selected = pool[Math.floor(Math.random() * pool.length)];

        localStorage.setItem("historyDate", dateKey);
        localStorage.setItem("todayPerson", selected.name);
      }
    } catch {
      selected = people[Math.floor(Math.random() * people.length)];
    }

    document.getElementById("personName").textContent =
      selected.name || "이름 정보 없음";

    document.getElementById("personPeriod").textContent =
      [selected.era, selected.birth_death].filter(Boolean).join(" · ");

    document.getElementById("personDescription").textContent =
      selected.description ||
      selected.contribution ||
      (Array.isArray(selected.major_activities)
        ? selected.major_activities.join("\n")
        : selected.major_activities) ||
      "이 인물의 자세한 기록은 추후 추가할 예정입니다.";

    personCard.classList.add("show");
    instructionText.textContent = "역사의 문이 열렸습니다.";
    knockButton.textContent = "문이 열렸습니다";
    personCard.scrollIntoView({ behavior: "smooth", block: "center" });

  } catch (error) {
    console.error(error);
    instructionText.textContent =
      "인물 정보를 불러오지 못했습니다. people.json의 데이터 형식을 확인해 주세요.";
  }
}

knockButton.addEventListener("click", knock);
</script>
</body>
</html>
