
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사관의 문을 두드리다</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

:root {
  --paper: #f5f0e7;
  --ink: #332d28;
  --wood: #6f3827;
  --gold: #c9a253;
  --green: #174534;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Serif KR', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 14px 50px;
}

/* ── 궁궐 단청 처마 ── */
.roof {
  position: relative;
  width: 100%;
  height: 112px;
  flex-shrink: 0;
  margin-bottom: 26px;
  background: #173f32;
  border-top: 8px solid #633522;
  border-bottom: 8px solid #633522;
  box-shadow: 0 7px 0 rgba(80, 48, 30, .12);
}

/* 단청의 반복 기하무늬 */
.roof-pattern {
  position: absolute;
  inset: 8px 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 17px,
      #d4b45f 17px 21px,
      transparent 21px 34px
    ),
    repeating-linear-gradient(
      45deg,
      transparent 0 11px,
      #b74732 11px 15px,
      transparent 15px 22px
    ),
    repeating-linear-gradient(
      -45deg,
      transparent 0 11px,
      #d4b45f 11px 14px,
      transparent 14px 22px
    );
}

/* 처마 위아래 장식선 */
.roof-top,
.roof-bottom {
  position: absolute;
  left: 0;
  right: 0;
  height: 13px;
  z-index: 2;
  background: repeating-linear-gradient(
    90deg,
    #a6402d 0 22px,
    #d9b75e 22px 28px,
    #174534 28px 50px,
    #d9b75e 50px 56px
  );
}

.roof-top {
  top: 0;
}

.roof-bottom {
  bottom: 0;
  height: 17px;
  border-top: 4px solid #e3c675;
  background: #713b28;
}

/* 처마 양 끝의 살짝 올라간 선 */
.roof::before,
.roof::after {
  content: "";
  position: absolute;
  top: -4px;
  width: 8%;
  height: 18px;
  background: #6f3827;
  border-top: 5px solid #d4b45f;
}

.roof::before {
  left: 0;
  transform: skewY(-8deg);
  transform-origin: left;
}

.roof::after {
  right: 0;
  transform: skewY(8deg);
  transform-origin: right;
}

/* ── 제목 ── */
header {
  text-align: center;
  margin-bottom: 25px;
}

.eyebrow {
  color: #8b765d;
  font-size: 11px;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

h1 {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 600;
  letter-spacing: -1.5px;
  margin: 0;
}

.subtitle {
  color: #8b7b69;
  font-size: 14px;
  margin-top: 10px;
}

/* ── 문틀 ── */
.gate-area {
  position: relative;
  width: min(94vw, 1250px);
  height: clamp(390px, 61vh, 680px);
  perspective: 1800px;
  transition: width .8s, height .8s;
}

.gate-frame {
  position: absolute;
  inset: 0;
  padding: 8px;
  background: var(--gold);
  border: 5px solid var(--wood);
  box-shadow:
    inset 0 0 0 3px #f2dda1,
    inset 0 0 0 7px #986b35,
    0 18px 36px rgba(51, 45, 40, .16);
}

.gate {
  position: absolute;
  inset: 8px;
  display: flex;
  overflow: hidden;
  background: var(--green);
  transform-style: preserve-3d;
}

/* 실제 이미지 사용 */
.door {
  position: relative;
  width: 50%;
  height: 100%;
  background-image: url("./palace-door.png");
  background-repeat: no-repeat;
  background-size: 200% 100%;
  border: 2px solid #d9b55c;
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 1.6s cubic-bezier(.65, 0, .25, 1);
}

.door.left {
  background-position: left center;
  transform-origin: left center;
  border-right: 2px solid #e8ca75;
}

.door.right {
  background-position: right center;
  transform-origin: right center;
  border-left: 2px solid #e8ca75;
}

.door::after {
  content: "";
  position: absolute;
  inset: 7px;
  border: 2px solid rgba(224, 190, 104, .55);
  pointer-events: none;
}

/* 금색 문고리 */
.knocker {
  position: absolute;
  top: 50%;
  width: 48px;
  height: 48px;
  z-index: 5;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 30%,
    #fff0b0,
    #e5bd59 45%,
    #9d6a24 80%
  );
  border: 4px double #fff0b0;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
  transform: translate(-50%, -50%);
  transition: opacity .3s;
}

.left .knocker {
  right: -24px;
}

.right .knocker {
  left: -24px;
}

.knocker::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 3px solid #80551f;
  border-radius: 50%;
}

.knocker::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #70431c;
  border: 2px solid #f5d988;
  border-radius: 50%;
}

/* 문을 확대 */
.gate-area.zoomed {
  width: min(98vw, 1450px);
  height: clamp(480px, 73vh, 820px);
}

.gate-area.zoomed .gate-frame {
  inset: -5px;
}

/* 두 문짝을 좌우로 열기 */
.gate-area.open .door.left {
  transform: rotateY(-110deg);
}

.gate-area.open .door.right {
  transform: rotateY(110deg);
}

.gate-area.open .knocker {
  opacity: 0;
}

/* ── 두드리기 버튼 ── */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
}

.knock-button {
  padding: 14px 32px;
  color: #f8f0df;
  background: var(--wood);
  border: 1px solid #9b7148;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
  transition: background .2s;
}

.knock-button:hover {
  background: #874832;
}

.knock-button:disabled {
  opacity: .6;
  cursor: default;
}

.hint {
  color: #8b7b69;
  font-size: 12px;
}

/* ── 문이 열린 뒤 오늘의 인물 ── */
.person-card {
  display: none;
  width: min(90vw, 650px);
  margin-top: 32px;
  padding: 30px 22px;
  text-align: center;
  background: rgba(255, 255, 255, .45);
  border: 1px solid #d6c6ae;
  animation: appear .8s ease both;
}

.person-card.visible {
  display: block;
}

.person-label {
  color: #98764a;
  font-size: 11px;
  letter-spacing: 3px;
}

.person-name {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 700;
  margin: 12px 0;
}

.person-description {
  color: #62564a;
  font-size: 15px;
  line-height: 1.9;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

body.unlocked .controls {
  display: none;
}

/* ── 모바일 화면 ── */
@media (max-width: 600px) {
  .page {
    padding: 0 6px 30px;
  }

  .roof {
    height: 76px;
    margin-bottom: 20px;
  }

  header {
    margin-bottom: 18px;
  }

  .gate-area {
    width: 97vw;
    height: 52vh;
    min-height: 350px;
  }

  .gate-frame {
    padding: 5px;
  }

  .gate {
    inset: 5px;
  }

  .door::after {
    inset: 4px;
  }

  .knocker {
    width: 38px;
    height: 38px;
  }

  .gate-area.zoomed {
    width: 99vw;
    height: 64vh;
    min-height: 430px;
  }

  .knock-button {
    padding: 12px 24px;
    font-size: 15px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="roof" aria-hidden="true">
    <div class="roof-top"></div>
    <div class="roof-pattern"></div>
    <div class="roof-bottom"></div>
  </div>

  <header>
    <div class="eyebrow">DAILY HISTORY FACT</div>
    <h1>역사관의 문을 두드리다</h1>
    <div class="subtitle">
      문 너머에서 오늘의 역사를 만나보세요.
    </div>
  </header>

  <section class="gate-area" id="gateArea" aria-label="궁궐 문">
    <div class="gate-frame">
      <div class="gate">

        <div class="door left">
          <div class="knocker"></div>
        </div>

        <div class="door right">
          <div class="knocker"></div>
        </div>

      </div>
    </div>
  </section>

  <div class="controls" id="controls">
    <button class="knock-button" id="knockButton">
      문고리 두드리기 · 0 / 3
    </button>
    <div class="hint" id="hint">
      문고리를 세 번 두드려 보세요.
    </div>
  </div>

  <section class="person-card" id="personCard">
    <div class="person-label">TODAY'S HISTORICAL FIGURE</div>
    <div class="person-name">세종대왕</div>
    <div class="person-description">
      훈민정음 창제를 통해 백성이 쉽게 글을 익힐 수 있도록 했습니다.
    </div>
  </section>

</main>

<script>
const gateArea = document.getElementById("gateArea");
const knockButton = document.getElementById("knockButton");
const hint = document.getElementById("hint");
const personCard = document.getElementById("personCard");

let knocks = 0;
let opening = false;

function knock() {
  if (opening) return;

  knocks++;

  knockButton.textContent =
    `문고리 두드리기 · ${knocks} / 3`;

  gateArea.animate(
    [
      { transform: "translateX(0)" },
      { transform: "translateX(-4px)" },
      { transform: "translateX(4px)" },
      { transform: "translateX(0)" }
    ],
    { duration: 220 }
  );

  if (knocks < 3) {
    hint.textContent = knocks === 1
      ? "첫 번째 두드림이 울려 퍼집니다."
      : "문 안쪽에서 인기척이 느껴집니다.";
    return;
  }

  opening = true;
  knockButton.disabled = true;
  hint.textContent = "역사의 문이 열립니다…";

  gateArea.classList.add("zoomed");

  setTimeout(() => {
    gateArea.classList.add("open");
  }, 650);

  setTimeout(() => {
    document.body.classList.add("unlocked");
    personCard.classList.add("visible");

    personCard.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }, 2200);
}

knockButton.addEventListener("click", knock);

gateArea.addEventListener("click", (event) => {
  if (!opening && event.target.closest(".door")) {
    knock();
  }
});
</script>

</body>
</html>
