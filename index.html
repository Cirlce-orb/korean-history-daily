<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1일 1한국사 인물</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#f5f0e7;
  color:#332d28;
  font-family:'Noto Serif KR',serif;
}

header{
  max-width:1100px;
  margin:auto;
  padding:28px 25px 18px;
  border-bottom:1px solid #d8cec0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:700;
}

.header-info{
  text-align:right;
}

.date{
  color:#776c61;
  font-size:14px;
}

.weather{
  color:#917b6f;
  font-size:13px;
  margin-top:5px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:55px 25px;
}

.intro{
  text-align:center;
  margin-bottom:45px;
}

.intro h1{
  font-size:42px;
  font-weight:600;
  margin-bottom:12px;
}

.intro p{
  color:#796f66;
}

.card{
  background:#fffdf9;
  border:1px solid #ded5c9;
  display:grid;
  grid-template-columns:1fr 1.15fr;
  min-height:440px;
  box-shadow:0 8px 30px rgba(70,55,40,.06);
}

.image{
  background:#e7dfd3;
  min-height:440px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image .fallback{
  font-size:80px;
  color:#817467;
}

.info{
  padding:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.label{
  color:#917b6f;
  font-size:14px;
  margin-bottom:15px;
}

.name{
  font-size:42px;
  margin-bottom:10px;
}

.period{
  color:#81766c;
  margin-bottom:28px;
}

.description{
  line-height:2;
  font-size:16px;
  margin-bottom:30px;
}

button{
  border:1px solid #917b6f;
  background:transparent;
  color:#66564d;
  padding:12px 20px;
  font-family:inherit;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:#917b6f;
  color:white;
}

.controls{
  display:flex;
  gap:10px;
  margin:35px 0;
}

input,select{
  background:#fffdf9;
  border:1px solid #d8cec0;
  padding:13px 15px;
  font-family:inherit;
  color:#443a33;
}

input{
  flex:1;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.person{
  background:#fffdf9;
  border:1px solid #ded5c9;
  padding:25px;
  cursor:pointer;
  transition:.2s;
}

.person:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(60,45,30,.08);
}

.person h3{
  margin-bottom:8px;
}

.person p{
  color:#82776c;
  font-size:13px;
}

footer{
  border-top:1px solid #d8cec0;
  text-align:center;
  padding:30px;
  color:#85796e;
  font-size:13px;
  margin-top:40px;
}

@media(max-width:700px){

  header{
    padding:20px;
  }

  .logo{
    font-size:20px;
  }

  main{
    padding:35px 18px;
  }

  .intro h1{
    font-size:31px;
  }

  .card{
    grid-template-columns:1fr;
  }

  .image{
    min-height:230px;
  }

  .info{
    padding:30px;
  }

  .name{
    font-size:32px;
  }

  .controls{
    flex-direction:column;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">1일 1한국사 인물</div>

  <div class="header-info">
    <div class="date" id="today"></div>
    <div class="weather" id="weather">
      날씨를 불러오는 중...
    </div>
  </div>

</header>

<main>

<section class="intro">

  <h1>오늘의 역사 인물</h1>

  <p>
    오늘 하루, 한 사람의 삶을 통해 역사를 만나보세요.
  </p>

</section>


<section class="card">

  <div class="image" id="personIcon">
    歷
  </div>

  <div class="info">

    <div class="label">
      TODAY'S HISTORICAL FIGURE
    </div>

    <h2 class="name" id="personName">
      불러오는 중...
    </h2>

    <div class="period" id="personPeriod"></div>

    <p class="description" id="personDescription"></p>

    <button onclick="showDetail()">
      인물 자세히 보기
    </button>

  </div>

</section>


<div class="controls">

  <input
    id="search"
    placeholder="인물 이름을 검색해보세요"
  >

  <select id="era">

    <option value="all">
      전체 시대
    </option>

    <option value="고대">
      고대
    </option>

    <option value="고려">
      고려
    </option>

    <option value="조선">
      조선
    </option>

    <option value="근대">
      근대
    </option>

    <option value="현대">
      현대
    </option>

  </select>

</div>


<section class="grid" id="people"></section>

</main>


<footer>
  Made by 16기 역덕 for 지현T
</footer>


<script>

let people = [];
let todayPerson = null;


/* =========================
   날짜
========================= */

const today = new Date();

const weekdays = [
  "일요일",
  "월요일",
  "화요일",
  "수요일",
  "목요일",
  "금요일",
  "토요일"
];

document.getElementById("today").textContent =
  today.getFullYear() + "년 " +
  (today.getMonth() + 1) + "월 " +
  today.getDate() + "일 " +
  weekdays[today.getDay()];


/* =========================
   오늘의 인물
========================= */

function getTodayPerson(){

  if(people.length === 0){
    return null;
  }

  const todayKey =
    today.getFullYear() + "-" +
    (today.getMonth() + 1) + "-" +
    today.getDate();

  let history =
    JSON.parse(
      localStorage.getItem("historyPeople") || "[]"
    );

  const savedDate =
    localStorage.getItem("historyDate");

  // 오늘 이미 뽑았다면 같은 인물 유지
  if(savedDate === todayKey && history.length > 0){

    const todayName =
      localStorage.getItem("todayPerson");

    const todayPerson =
      people.find(person =>
        person.name === todayName
      );

    if(todayPerson){
      return todayPerson;
    }
  }

  // 모든 인물을 한 번씩 사용했다면 초기화
  if(history.length >= people.length){
    history = [];
  }

  // 아직 나오지 않은 인물만 선택
  const unusedPeople =
    people.filter(person =>
      !history.includes(person.name)
    );

  // 사용하지 않은 인물 중 랜덤 선택
  const randomIndex =
    Math.floor(
      Math.random() * unusedPeople.length
    );

  const selectedPerson =
    unusedPeople[randomIndex];

  // 기록 저장
  history.push(selectedPerson.name);

  localStorage.setItem(
    "historyPeople",
    JSON.stringify(history)
  );

  localStorage.setItem(
    "todayPerson",
    selectedPerson.name
  );

  localStorage.setItem(
    "historyDate",
    todayKey
  );

  return selectedPerson;
}


/* =========================
   오늘의 인물 표시
========================= */

/* =========================
   오늘의 인물 표시
========================= */

async function loadPersonImage(person){

  const imageBox =
    document.getElementById("personIcon");

  imageBox.innerHTML =
    `<div class="fallback">${person.name.charAt(0)}</div>`;

  try{

    // 1차: 위키미디어 공용에서 인물 이름으로 이미지 검색
    const searchUrl =
      "https://commons.wikimedia.org/w/api.php" +
      "?action=query" +
      "&format=json" +
      "&list=search" +
      "&srnamespace=6" +
      "&srlimit=10" +
      "&srsearch=" +
      encodeURIComponent(person.name) +
      "&origin=*";

    const searchResponse =
      await fetch(searchUrl);

    if(!searchResponse.ok){
      throw new Error("Commons 검색 실패");
    }

    const searchData =
      await searchResponse.json();

    const results =
      searchData.query &&
      searchData.query.search;

    if(results && results.length > 0){

      for(const result of results){

        const title =
          result.title;

        const imageUrl =
          "https://commons.wikimedia.org/w/api.php" +
          "?action=query" +
          "&format=json" +
          "&prop=imageinfo" +
          "&iiprop=url" +
          "&iiurlwidth=800" +
          "&titles=" +
          encodeURIComponent(title) +
          "&origin=*";

        const imageResponse =
          await fetch(imageUrl);

        if(!imageResponse.ok){
          continue;
        }

        const imageData =
          await imageResponse.json();

        const pages =
          imageData.query &&
          imageData.query.pages;

        if(!pages){
          continue;
        }

        const page =
          Object.values(pages)[0];

        if(
          page &&
          page.imageinfo &&
          page.imageinfo.length > 0
        ){

          const info =
            page.imageinfo[0];

          const finalUrl =
            info.thumburl ||
            info.url;

          if(finalUrl){

            imageBox.innerHTML = `
              <img
                src="${finalUrl}"
                alt="${person.name}"
              >
            `;

            return;
          }
        }
      }
    }

    // 2차: 한국어 위키백과에서 검색
    const wikiUrl =
      "https://ko.wikipedia.org/w/api.php" +
      "?action=query" +
      "&format=json" +
      "&generator=search" +
      "&gsrsearch=" +
      encodeURIComponent(person.name) +
      "&gsrnamespace=0" +
      "&gsrlimit=5" +
      "&prop=pageimages" +
      "&piprop=thumbnail" +
      "&pithumbsize=800" +
      "&origin=*";

    const wikiResponse =
      await fetch(wikiUrl);

    if(!wikiResponse.ok){
      return;
    }

    const wikiData =
      await wikiResponse.json();

    if(
      wikiData.query &&
      wikiData.query.pages
    ){

      const pages =
        Object.values(wikiData.query.pages);

      const page =
        pages.find(
          page =>
            page.thumbnail &&
            page.thumbnail.source
        );

      if(page){

        imageBox.innerHTML = `
          <img
            src="${page.thumbnail.source}"
            alt="${person.name}"
          >
        `;
      }
    }

  }catch(error){

    console.error(
      "이미지 불러오기 실패:",
      error
    );

  }
}

/* =========================
   인물 목록
========================= */


function renderPeople(){

  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const era =
    document.getElementById("era").value;

  const filtered = people.filter(person => {

    const matchName =
      person.name
      .toLowerCase()
      .includes(search);

    const matchEra =
      era === "all" ||
      person.era === era;

    return matchName && matchEra;

  });

  const container =
    document.getElementById("people");

  container.innerHTML =
    filtered.map(person => `

      <div
        class="person"
        onclick="selectPerson(${JSON.stringify(person.name)})"
      >

        <h3>
          ${person.name}
        </h3>

        <p>
          ${person.era} · ${person.birth_death}
        </p>

      </div>

    `).join("");

  if(filtered.length === 0){

    container.innerHTML = `

      <p style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
        color:#82776c;
      ">

        검색 결과가 없습니다.

      </p>

    `;

  }

}

/* =========================
   인물 선택
========================= */

function selectPerson(name){

  const person =
    people.find(p => p.name === name);

  if(!person){
    return;
  }

  todayPerson = person;

  document.getElementById("personName").textContent =
    person.name;

  document.getElementById("personPeriod").textContent =
    person.era + " · " +
    person.birth_death;

  document.getElementById("personDescription").textContent =
    person.description;

  loadPersonImage(person);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================
   자세히 보기
========================= */

function showDetail(){

  if(!todayPerson){
    return;
  }


  const activities =
    todayPerson.major_activities || [];


  let message =
    todayPerson.name +
    "\n\n" +
    todayPerson.description;


  if(activities.length > 0){

    message +=
      "\n\n주요 활동\n\n" +
      activities.join("\n");

  }


  if(todayPerson.source_url){

    message +=
      "\n\n출처\n" +
      todayPerson.source_url;

  }


  alert(message);

}


/* =========================
   검색 / 필터
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderPeople
  );


document
  .getElementById("era")
  .addEventListener(
    "change",
    renderPeople
  );


/* =========================
   날씨
========================= */

async function getWeather(){

  const weatherElement =
    document.getElementById("weather");


  try{

    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul"
    );


    if(!response.ok){
      throw new Error(
        "Weather request failed"
      );
    }


    const data =
      await response.json();


    const temperature =
      Math.round(
        data.current.temperature_2m
      );


    const max =
      Math.round(
        data.daily.temperature_2m_max[0]
      );


    const min =
      Math.round(
        data.daily.temperature_2m_min[0]
      );


    const code =
      data.current.weather_code;


    let weatherText = "맑음";


    if(code >= 1 && code <= 3){
      weatherText = "구름";
    }

    else if(code >= 45 && code <= 48){
      weatherText = "안개";
    }

    else if(code >= 51 && code <= 67){
      weatherText = "비";
    }

    else if(code >= 71 && code <= 77){
      weatherText = "눈";
    }

    else if(code >= 80 && code <= 82){
      weatherText = "소나기";
    }

    else if(code >= 95){
      weatherText = "뇌우";
    }


    weatherElement.textContent =
      "서울 · " +
      weatherText +
      " · 현재 " +
      temperature +
      "°C · 최고 " +
      max +
      "°C / 최저 " +
      min +
      "°C";


  }catch(error){

    console.error(
      "날씨 불러오기 실패:",
      error
    );


    weatherElement.textContent =
      "서울 · 날씨 정보를 불러올 수 없습니다.";

  }

}


/* =========================
   people.json 불러오기
========================= */

async function loadPeople(){

  try{

    const response =
      await fetch("./people.json");


    if(!response.ok){

      throw new Error(
        "people.json HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "people.json의 형식이 올바르지 않습니다."
      );

    }


    people = data.filter(person =>
      person &&
      person.name &&
      person.era
    );


    if(people.length === 0){

      throw new Error(
        "사용할 수 있는 인물 데이터가 없습니다."
      );

    }


    displayToday();
    renderPeople();


  }catch(error){

    console.error(
      "people.json 불러오기 실패:",
      error
    );


    document.getElementById(
      "personName"
    ).textContent =
      "인물 데이터를 불러올 수 없습니다.";

    document.getElementById(
      "personDescription"
    ).textContent =
      "people.json 파일이 index.html과 같은 폴더에 있는지 확인해주세요.";

  }

}


/* =========================
   실행
========================= */

loadPeople();
getWeather();

</script>

</body>
</html>
